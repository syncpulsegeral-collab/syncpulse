<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncPulse Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        :root { --accent: #3b82f6; --bg: #050a12; --card: #0b111d; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .page-view { display: none; flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .page-view.active { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(11, 17, 29, 0.95); backdrop-filter: blur(10px); border-top: 1px solid #1e293b; display: grid; grid-template-columns: repeat(4, 1fr); z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #64748b; font-size: 10px; font-weight: 700; text-transform: uppercase; gap: 4px; }
        .nav-item.active { color: var(--accent); }
        .m-card { background: var(--card); border: 1px solid #1e293b; border-radius: 20px; padding: 16px; margin-bottom: 12px; }
        .quota-bar { height: 6px; background: #1e293b; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .quota-fill { height: 100%; background: var(--accent); transition: width 1s ease; }
    </style>
</head>
<body>

    <header class="p-5 border-b border-white/5 flex justify-between items-center bg-[#050a12] sticky top-0 z-50">
        <h1 class="font-black text-lg tracking-tighter uppercase">Sync<span class="text-blue-500">Pulse</span></h1>
        <div class="flex items-center gap-2">
            <span id="conn-status" class="text-[8px] font-black text-slate-500 uppercase">Online</span>
            <div class="w-2 h-2 rounded-full bg-green-500"></div>
        </div>
    </header>

    <main id="main-content" class="flex-1 overflow-hidden flex flex-col">
        <!-- PÁGINA 1: HOME -->
        <div id="page-home" class="page-view active">
            <h2 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-4">Resumo do Sistema</h2>
            <div class="m-card flex items-center justify-between bg-blue-600/5 border-blue-500/20">
                <div>
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Tarefas Ativas</p>
                    <p id="home-tasks-count" class="text-4xl font-black text-white">0</p>
                </div>
                <div class="w-12 h-12 rounded-full bg-blue-500/20 flex items-center justify-center">
                    <i class="fas fa-play text-blue-500"></i>
                </div>
            </div>
            <div id="home-storage-list"></div>
        </div>

        <!-- PÁGINA 2: CLOUDS -->
        <div id="page-storage" class="page-view">
            <h2 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-4">Minhas Clouds</h2>
            <div id="mobile-cloud-list"></div>
        </div>

        <!-- PÁGINA 3: TAREFAS -->
        <div id="page-tasks" class="page-view">
            <h2 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-4">Lista de Tarefas</h2>
            <div id="mobile-task-list"></div>
        </div>

        <!-- PÁGINA 4: MENU -->
        <div id="page-settings" class="page-view">
            <h2 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-6">Definições</h2>
            <div class="m-card">
                <p class="text-blue-400 font-bold text-sm mb-1">Licença Ativa</p>
                <p class="text-slate-500 text-[10px] uppercase">ZimaOS Hybrid Edition</p>
            </div>
            <button onclick="location.reload()" class="w-full py-4 bg-slate-800 rounded-2xl font-black text-[10px] uppercase tracking-widest">Atualizar Interface</button>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="changePage('home', this)"><i class="fas fa-th-large text-xl"></i><span>Home</span></div>
        <div class="nav-item" onclick="changePage('storage', this)"><i class="fas fa-cloud text-xl"></i><span>Clouds</span></div>
        <div class="nav-item" onclick="changePage('tasks', this)"><i class="fas fa-list-ul text-xl"></i><span>Tarefas</span></div>
        <div class="nav-item" onclick="changePage('settings', this)"><i class="fas fa-bars text-xl"></i><span>Menu</span></div>
    </nav>

    <script>
        const API = window.location.origin;
        let globalTasks = [];

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return "0 B";
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(1) + " " + ['B', 'KB', 'MB', 'GB', 'TB'][i];
        }

        async function fetchData() {
            try {
                // 1. Carregar Clouds
                const rClouds = await fetch(`${API}/api/remotes/list_with_quota`);
                const clouds = await rClouds.json();
                renderClouds(clouds);

                // 2. Carregar Tarefas
                const r = await fetch(`${API}/api/tasks`); // API é window.location.origin
				const tasks = await r.json();
                renderTasks(globalTasks);
                
                // Atualizar contador na home
                document.getElementById('home-tasks-count').innerText = globalTasks.length;
            } catch (e) {
                console.error("Erro ao carregar dados:", e);
                document.getElementById('mobile-task-list').innerHTML = `<p class="text-red-500 text-center py-10 text-xs">Erro ao ligar ao motor SyncPulse.</p>`;
            }
        }

        function renderClouds(clouds) {
            const list = clouds.map(rem => {
                const percent = rem.quota.total > 0 ? Math.round((rem.quota.used / rem.quota.total) * 100) : 0;
                return `
                <div class="m-card">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h4 class="font-bold text-white text-sm">${rem.name}</h4>
                            <p class="text-[9px] text-slate-500 uppercase">${rem.type}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-blue-400 font-black text-[11px]">${percent}%</p>
                            <p class="text-[8px] text-slate-600 uppercase font-bold">${formatBytes(rem.quota.used)} / ${formatBytes(rem.quota.total)}</p>
                        </div>
                    </div>
                    <div class="quota-bar"><div class="quota-fill" style="width: ${percent}%"></div></div>
                </div>`;
            }).join('');
            
            document.getElementById('mobile-cloud-list').innerHTML = list || '<p class="text-center text-slate-500 text-xs">Sem clouds.</p>';
            document.getElementById('home-storage-list').innerHTML = list; // Resumo na home
        }

        function renderTasks(tasks) {
            const list = tasks.map(t => `
                <div class="m-card">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-[10px] font-black text-white uppercase">${t.name}</span>
                        <span class="text-[8px] px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 font-bold uppercase">${t.type}</span>
                    </div>
                    <div class="space-y-1 mb-4 opacity-60">
                        <p class="text-[9px] truncate"><i class="fas fa-folder mr-1"></i> ${t.local}</p>
                        <p class="text-[9px] truncate"><i class="fas fa-cloud mr-1"></i> ${t.remote}</p>
                    </div>
                    <div class="flex gap-2">
                        <button class="flex-1 py-3 bg-blue-600 rounded-xl text-[9px] font-black uppercase text-white">Iniciar</button>
                        <button class="px-5 py-3 bg-slate-800 rounded-xl text-[9px] font-black uppercase text-slate-400">Log</button>
                    </div>
                </div>`).join('');
            
            document.getElementById('mobile-task-list').innerHTML = list || '<p class="text-center text-slate-500 text-xs py-10">Nenhuma tarefa configurada.</p>';
        }

        function changePage(pageId, element) {
            document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
            
            // Re-fetch ao trocar para garantir que o "undefined" não aparece
            if (pageId === 'home') document.getElementById('home-tasks-count').innerText = globalTasks.length;
        }

        window.onload = fetchData;
        // Atualiza os dados a cada 10 segundos automaticamente
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
