<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncPulse Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        :root { --accent: #3b82f6; --bg: #050a12; --card: #0b111d; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .page-view { display: none; flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; animation: fadeIn 0.2s ease-out; }
        .page-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(11, 17, 29, 0.95); backdrop-filter: blur(10px); border-top: 1px solid #1e293b; display: grid; grid-template-columns: repeat(4, 1fr); z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #64748b; font-size: 10px; font-weight: 700; text-transform: uppercase; gap: 4px; }
        .nav-item.active { color: var(--accent); }

        .m-card { background: var(--card); border: 1px solid #1e293b; border-radius: 20px; padding: 16px; margin-bottom: 12px; }
        .quota-bar { height: 6px; background: #1e293b; border-radius: 10px; overflow: hidden; }
        .quota-fill { height: 100%; background: var(--accent); transition: width 1s ease; }
    </style>
</head>
<body>

    <header class="p-5 border-b border-white/5 flex justify-between items-center bg-[#050a12]">
        <h1 class="font-black text-lg tracking-tighter uppercase">Sync<span class="text-blue-500">Pulse</span></h1>
        <div id="status-dot" class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
    </header>

    <!-- PÁGINA 1: HOME -->
    <div id="page-home" class="page-view active">
        <h2 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-4">Resumo do Sistema</h2>
        <div class="m-card flex items-center justify-between">
            <div>
                <p class="text-[10px] text-slate-500 font-bold uppercase">Tarefas Configuradas</p>
                <p id="active-tasks-count" class="text-3xl font-black">0</p>
            </div>
            <i class="fas fa-play-circle text-blue-500 text-3xl"></i>
        </div>
        <div id="storage-summary-home"></div>
    </div>

    <!-- PÁGINA 2: CLOUDS -->
    <div id="page-storage" class="page-view">
        <h2 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-4">Nuvens Conectadas</h2>
        <div id="mobile-cloud-list">
            <p class="text-center py-10 text-slate-500 animate-pulse text-xs font-bold">A carregar clouds...</p>
        </div>
    </div>

    <!-- PÁGINA 3: TAREFAS -->
    <div id="page-tasks" class="page-view">
        <h2 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-4">Tarefas de Sincronização</h2>
        <div id="mobile-task-list">
            <p class="text-center py-10 text-slate-500 animate-pulse text-xs font-bold">A carregar tarefas...</p>
        </div>
    </div>

    <!-- PÁGINA 4: MENU -->
    <div id="page-settings" class="page-view">
        <h2 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-6">Ajustes</h2>
        <div class="m-card">
            <p class="text-xs font-bold mb-2 text-blue-400">SyncPulse V1.1</p>
            <p class="text-[10px] text-slate-500 uppercase">Acesso remoto via ZimaOS</p>
        </div>
        <button onclick="location.reload()" class="w-full py-4 bg-slate-800 rounded-2xl font-black text-[10px] uppercase text-white">Atualizar Dados</button>
    </div>

    <!-- NAV INFERIOR -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="changePage('home', this)"><i class="fas fa-home text-xl"></i><span>Home</span></div>
        <div class="nav-item" onclick="changePage('storage', this)"><i class="fas fa-cloud text-xl"></i><span>Clouds</span></div>
        <div class="nav-item" onclick="changePage('tasks', this)"><i class="fas fa-tasks text-xl"></i><span>Tarefas</span></div>
        <div class="nav-item" onclick="changePage('settings', this)"><i class="fas fa-cog text-xl"></i><span>Menu</span></div>
    </nav>

    <script>
        const BASE_URL = window.location.origin;

        // Função para formatar bytes (GB, TB, etc)
        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return "0 B";
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(1) + " " + ['B', 'KB', 'MB', 'GB', 'TB'][i];
        }

        async function initMobile() {
            await loadClouds();
            await loadTasks();
        }

        async function loadClouds() {
            const container = document.getElementById('mobile-cloud-list');
            const summaryHome = document.getElementById('storage-summary-home');
            try {
                const r = await fetch(`${BASE_URL}/api/remotes/list_with_quota`);
                const remotes = await r.json();
                
                let html = "";
                remotes.forEach(rem => {
                    const percent = rem.quota.total > 0 ? Math.round((rem.quota.used / rem.quota.total) * 100) : 0;
                    html += `
                    <div class="m-card">
                        <div class="flex items-center gap-4 mb-4">
                            <div class="w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-400">
                                <i class="fas fa-cloud"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="font-bold text-sm truncate">${rem.name}</h4>
                                <p class="text-[9px] text-slate-500 uppercase">${formatBytes(rem.quota.used)} / ${formatBytes(rem.quota.total)}</p>
                            </div>
                            <div class="text-[10px] font-black text-blue-500">${percent}%</div>
                        </div>
                        <div class="quota-bar"><div class="quota-fill" style="width: ${percent}%"></div></div>
                    </div>`;
                });
                container.innerHTML = html;
                summaryHome.innerHTML = html; // Mostra o mesmo resumo na home
            } catch (e) {
                container.innerHTML = `<p class="text-red-500 text-center text-xs">Erro ao carregar storage.</p>`;
            }
        }

        async function loadTasks() {
            const container = document.getElementById('mobile-task-list');
            const activeCount = document.getElementById('active-tasks-count');
            try {
                const r = await fetch(`${BASE_URL}/api/tasks`);
                const tasks = await r.json();
                
                // Correção do Undefined: verifica se é array
                activeCount.innerText = Array.isArray(tasks) ? tasks.length : 0;

                if (!Array.isArray(tasks) || tasks.length === 0) {
                    container.innerHTML = `<p class="text-center py-10 text-slate-600 text-xs italic">Nenhuma tarefa configurada.</p>`;
                    return;
                }

                container.innerHTML = tasks.map(t => `
                    <div class="m-card">
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-bold text-sm text-white">${t.name}</h4>
                            <span class="text-[8px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full font-black uppercase">${t.type}</span>
                        </div>
                        <p class="text-[9px] text-slate-500 truncate mb-1">Local: ${t.local}</p>
                        <p class="text-[9px] text-slate-500 truncate mb-3">Cloud: ${t.remote}</p>
                        <div class="flex gap-2">
                            <button class="flex-1 py-3 bg-blue-600 rounded-xl text-[9px] font-black uppercase text-white shadow-lg shadow-blue-600/20">Iniciar</button>
                            <button class="px-5 py-3 bg-slate-800 rounded-xl text-[9px] font-black uppercase text-slate-300">Log</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                activeCount.innerText = "!";
                container.innerHTML = `<p class="text-red-500 text-center text-xs p-10">Erro de ligação ao motor.</p>`;
            }
        }

        function changePage(pageId, element) {
            document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
        }

        window.onload = initMobile;
    </script>
</body>
</html>
