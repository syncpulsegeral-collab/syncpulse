<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SyncPulse - Mobile</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
        --bg: #050a12; --bg-nav: #0b111d; --card: #111d29;
        --border: #1e293b; --text: #ffffff; --text-dim: #94a3b8;
        --accent: #3b82f6; --orange: #f97316; --green: #22c55e; --red: #ef4444;
    }

    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header e Status */
    .topbar { padding: 20px 20px 15px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); transition: 0.3s; }
    .conn-dot.online { background: var(--green); box-shadow: 0 0 10px var(--green); }

    /* Views */
    .view { display: none; flex: 1; overflow-y: auto; padding: 20px 20px 100px; }
    .view.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .section-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 20px; }

    /* Cartões de Tarefas (Exato aos prints) */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 15px; position: relative; }
    .card.active-border { border-left: 4px solid var(--accent); }
    .card-title { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .status-badge { font-size: 10px; background: rgba(30, 41, 59, 0.8); padding: 3px 12px; border-radius: 10px; color: var(--text-dim); font-weight: 700; }
    
    .path-line { font-size: 10px; color: #475569; margin: 4px 0; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta-info { color: var(--accent); font-size: 11px; font-weight: 700; display: flex; gap: 15px; margin: 12px 0; }
    .last-sync { font-style: italic; font-size: 9px; color: #475569; margin-bottom: 15px; }

    /* Botões de Ação */
    .btn-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); pt-15px; padding-top: 15px; }
    .action-group { display: flex; gap: 20px; }
    .btn-action { font-size: 11px; font-weight: 900; text-transform: uppercase; display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; }
    .btn-sim { color: var(--orange); }
    .btn-play { color: var(--accent); }
    .btn-stop { color: var(--red); }
    .icon-history { color: #475569; font-size: 16px; }

    /* Cartões de Cloud (Exato aos prints) */
    .cloud-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
    .cloud-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    .cloud-icon { width: 45px; height: 40px; background: rgba(59,130,246,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--accent); }
    .quota-label { font-size: 10px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; display: block; }
    .quota-bar-bg { height: 4px; background: #070e1e; border-radius: 10px; overflow: hidden; margin: 10px 0; }
    .quota-bar-fill { height: 100%; background: var(--accent); border-radius: 10px; transition: width 1s ease; }
    .quota-footer { display: flex; justify-content: space-between; font-size: 9px; font-weight: 800; color: #475569; text-transform: uppercase; }

    /* Navegação Inferior */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: var(--bg-nav); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, 1fr); z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #475569; font-size: 10px; font-weight: 700; gap: 4px; }
    .nav-item.active { color: var(--accent); }
    .nav-item i { font-size: 18px; }

    /* Sub-páginas */
    .back-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; color: var(--accent); font-weight: 800; font-size: 12px; }
    .file-row { padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

    /* Settings */
    .settings-group { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
    .theme-toggle { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); padding: 5px; border-radius: 12px; margin-top: 10px; }
    .theme-btn { padding: 10px; border-radius: 10px; font-size: 11px; font-weight: 800; text-align: center; border:none; color: var(--text-dim); background:transparent; }
    .theme-btn.active { background: var(--accent); color: white; }
    .lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .lang-btn { padding: 15px 5px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text-dim); font-weight: 800; font-size: 11px; }
    .lang-btn.active { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

  <div class="topbar">
    <div class="flex items-center gap-3">
        <div id="conn-dot" class="conn-dot"></div>
        <div>
            <h1 class="text-white font-black uppercase text-sm tracking-tight">SyncPulse</h1>
            <span class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">ZimaOS Edition</span>
        </div>
    </div>
  </div>

  <!-- VIEW: HOME (ATIVAS) -->
  <div class="view active" id="view-home">
    <div class="section-title">Tarefas em execução</div>
    <div id="home-list"></div>
  </div>

  <!-- VIEW: CLOUDS -->
  <div class="view" id="view-clouds">
    <div class="section-title">Clouds Ligadas</div>
    <div id="clouds-list"></div>
  </div>

  <!-- VIEW: TAREFAS -->
  <div class="view" id="view-tasks">
    <div class="section-title">Todas as tarefas</div>
    <div id="tasks-list"></div>
  </div>

  <!-- SUB-VIEW: LISTA DE FICHEIROS -->
  <div id="view-detail" class="view">
    <div class="back-header" onclick="switchTab('tasks')"><i class="fas fa-arrow-left"></i> VOLTAR ÀS TAREFAS</div>
    <div id="detail-title-area" class="mb-6"></div>
    <div id="file-list"></div>
  </div>

  <!-- SUB-VIEW: HISTÓRICO -->
  <div id="view-history" class="view">
    <div class="back-header" onclick="switchTab('tasks')"><i class="fas fa-arrow-left"></i> VOLTAR</div>
    <div class="section-title">Histórico de Atividade</div>
    <div id="history-content"></div>
  </div>

  <!-- VIEW: DEFINIÇÕES -->
  <div class="view" id="view-settings">
    <div class="section-title">Definições</div>
    <div class="settings-group">
        <span class="quota-label">Aparência</span>
        <div class="theme-toggle">
            <button class="theme-btn active"><i class="fas fa-moon mr-2"></i>Escuro</button>
            <button class="theme-btn"><i class="fas fa-sun mr-2"></i>Claro</button>
        </div>
    </div>
    <div class="settings-group">
        <span class="quota-label">Idioma</span>
        <div class="lang-grid">
            <button class="lang-btn active">PT</button>
            <button class="lang-btn">EN</button>
            <button class="lang-btn">ES</button>
            <button class="lang-btn">FR</button>
            <button class="lang-btn">DE</button>
        </div>
    </div>
  </div>

  <!-- NAVEGAÇÃO -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="home" onclick="switchTab('home')"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="nav-item" data-tab="clouds" onclick="switchTab('clouds')"><i class="fas fa-cloud"></i><span>Clouds</span></div>
    <div class="nav-item" data-tab="tasks" onclick="switchTab('tasks')"><i class="fas fa-list-check"></i><span>Tarefas</span></div>
    <div class="nav-item" data-tab="settings" onclick="switchTab('settings')"><i class="fas fa-gear"></i><span>Definições</span></div>
  </nav>

<script>
let socket, tasks = [], STATE = {}, currentTid = null;

function switchTab(tab) {
    currentTid = null;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('view-' + tab).classList.add('active');
    const navItem = document.querySelector(`[data-tab="${tab}"]`);
    if(navItem) navItem.classList.add('active');
    if(tab === 'clouds') loadClouds();
}

/* --- Conetividade --- */
function connect() {
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    socket = new WebSocket(proto + location.host + '/ws');
    socket.onopen = () => document.getElementById('conn-dot').classList.add('online');
    socket.onclose = () => { document.getElementById('conn-dot').classList.remove('online'); setTimeout(connect, 3000); };
    socket.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        if(data.type === 'init') { tasks = data.tasks; STATE = data.state; }
        if(data.type === 'update') { STATE = data.state; }
        renderAll();
    };
}

function renderAll() {
    renderHome();
    renderTasks();
    if(currentTid) renderFiles();
}

/* --- Renderização exata aos prints --- */
function renderTasks() {
    const list = document.getElementById('tasks-list');
    list.innerHTML = tasks.map(tk => {
        const isRunning = (STATE.running[tk.id] || 'idle') !== 'idle';
        const syncIcon = tk.type === 'download' ? 'fa-arrow-down' : (tk.type === 'upload' ? 'fa-arrow-up' : 'fa-rotate');
        return `
        <div class="card ${isRunning ? 'active-border' : ''}" onclick="openDetail('${tk.id}')">
            <div class="flex justify-between items-center mb-3">
                <div class="card-title">
                    <div class="status-dot ${isRunning ? 'active' : ''}"></div>
                    <span>${tk.name}</span>
                </div>
                <div class="status-badge">${STATE.running[tk.id] || 'Inativo'}</div>
            </div>
            <div class="path-line">L: ${tk.local}</div>
            <div class="path-line">C: ${tk.remote}</div>
            <div class="meta-info">
                <span><i class="fas ${syncIcon} mr-1"></i> ${tk.type}</span>
                <span><i class="fas fa-clock mr-1"></i> ${tk.interval || 'Tempo Real'}</span>
            </div>
            <div class="last-sync">Última sinc.: ${tk.last_sync || '---'}</div>
            <div class="btn-row">
                <div class="action-group">
                    <button class="btn-action btn-sim" onclick="event.stopPropagation(); startSync('${tk.id}', true)"><i class="fas fa-flask"></i> SIMULAR</button>
                    <button class="btn-action btn-play" onclick="event.stopPropagation(); startSync('${tk.id}', false)"><i class="fas fa-play"></i> INICIAR</button>
                </div>
                <i class="fas fa-history icon-history" onclick="event.stopPropagation(); showHistory('${tk.id}')"></i>
            </div>
        </div>`;
    }).join('');
}

function renderHome() {
    const list = document.getElementById('home-list');
    const running = tasks.filter(tk => (STATE.running[tk.id] || 'idle') !== 'idle');
    if(!running.length) { list.innerHTML = '<div class="p-10 text-center opacity-30 text-xs">Nenhuma tarefa ativa</div>'; return; }
    
    list.innerHTML = running.map(tk => {
        const stats = STATE.stats[tk.id] || { percent: 0 };
        return `
        <div class="card active-border" onclick="openDetail('${tk.id}')">
            <div class="card-title mb-4">${tk.name}</div>
            <div class="quota-bar-bg"><div class="quota-bar-fill" style="width: ${stats.percent}%"></div></div>
            <div class="flex justify-between mt-2 text-[10px] font-black uppercase text-slate-500">
                <span>Progresso</span>
                <span>${stats.percent}%</span>
            </div>
        </div>`;
    }).join('');
}

async function loadClouds() {
    const list = document.getElementById('clouds-list');
    const r = await fetch('/api/remotes/list_with_quota');
    const data = await r.json();
    
    list.innerHTML = data.map(c => {
        const percent = c.quota.total ? Math.round((c.quota.used / c.quota.total) * 100) : 0;
        const formatSize = (b) => (b / 1e9).toFixed(1) + " GB";
        return `
        <div class="cloud-card">
            <div class="cloud-header">
                <div class="cloud-icon"><i class="fab fa-${getIcon(c.type)} text-xl"></i></div>
                <div>
                    <div class="cloud-name">${c.name}</div>
                    <div class="cloud-type">${c.type}</div>
                </div>
            </div>
            <div class="flex justify-between items-end mb-1">
                <span class="quota-label !mb-0">Usado</span>
                <span class="text-blue-400 font-black text-xs">${formatSize(c.quota.used)}</span>
            </div>
            <div class="quota-bar-bg"><div class="quota-bar-fill" style="width: ${percent}%"></div></div>
            <div class="quota-footer">
                <span>${percent}%</span>
                <span>Total: ${formatSize(c.quota.total)}</span>
            </div>
        </div>`;
    }).join('');
}

/* --- Sub-páginas --- */
function openDetail(id) { currentTid = id; switchTab('detail'); renderFiles(); }

function renderFiles() {
    const tk = tasks.find(t => String(t.id) === String(currentTid));
    const container = document.getElementById('file-list');
    const header = document.getElementById('detail-header');
    if(!tk) return;

    header.innerHTML = `<h2 class="text-xl font-black">${tk.name}</h2><p class="text-[10px] text-blue-500 uppercase font-bold">${tk.type}</p>`;
    const all = STATE.all_files[currentTid] || [];
    container.innerHTML = all.map(f => {
        let color = "#475569", icon = "fa-clock", status = "Pendente";
        if(STATE.finished_files[currentTid]?.includes(f)) { color = "var(--green)"; icon = "fa-circle-check"; status = "Concluído"; }
        if(STATE.failed_files[currentTid]?.includes(f)) { color = "var(--red)"; icon = "fa-circle-xmark"; status = "Erro"; }
        if(STATE.active_files[currentTid]?.some(a => a.name === f)) { color = "var(--accent)"; icon = "fa-sync fa-spin"; status = "Ativo"; }
        
        return `<div class="file-row">
            <span class="text-xs truncate mr-4" style="color: ${color}"><i class="fas ${icon} mr-3"></i>${f.split('/').pop()}</span>
            <span class="text-[8px] font-black uppercase" style="color: ${color}">${status}</span>
        </div>`;
    }).join('');
}

async function showHistory(id) {
    currentTid = id; switchTab('history');
    const r = await fetch(`/api/history/${id}`);
    const data = await r.json();
    document.getElementById('history-content').innerHTML = data.map(h => `
        <div class="card">
            <div class="flex justify-between text-[10px] font-black mb-2">
                <span style="color:${h.status==='Sucesso'?'var(--green)':'var(--red)'}">${h.type.toUpperCase()}</span>
                <span class="text-slate-500">${h.date}</span>
            </div>
            <div class="text-xs font-bold text-slate-300">${h.mode} · ${h.status}</div>
        </div>`).join('');
}

/* --- Helpers --- */
function getIcon(t) { 
    t = t.toLowerCase();
    if(t.includes('drive')) return 'google-drive';
    if(t.includes('dropbox')) return 'dropbox';
    if(t.includes('onedrive')) return 'microsoft';
    if(t.includes('mega')) return 'cloud';
    return 'cloud';
}
async function startSync(id, sim) { await fetch(`/api/sync/${id}?simulate=${sim}`, {method:'POST'}); }
async function stopSync(id) { await fetch(`/api/sync/stop/${id}`, {method:'POST'}); }

window.onload = connect;
</script>
</body>
</html>
