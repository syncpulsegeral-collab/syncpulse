<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SyncPulse Mobile</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    
    :root {
        --bg: #050a12; --bg-nav: #0b111d; --card: #111d29; --card-alt: #162635;
        --border: #1e293b; --text: #ffffff; --text-dim: #94a3b8; --text-faint: #475569;
        --accent: #3b82f6; --orange: #f97316; --green: #22c55e; --red: #ef4444;
        --badge-bg: rgba(30, 41, 59, 0.8);
    }

    html[data-theme="light"] {
        --bg: #e2e8f0; --bg-nav: #ffffff; --card: #ffffff; --card-alt: #f8fafc;
        --border: #cbd5e1; --text: #0f172a; --text-dim: #475569; --text-faint: #94a3b8;
        --accent: #3b82f6; --badge-bg: #475569;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    *::-webkit-scrollbar { display: none; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: all 0.2s; }

    /* Layout */
    .topbar { padding: max(15px, env(safe-area-inset-top)) 20px 12px; background: var(--bg-nav); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); transition: 0.3s; }
    .conn-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }

    .view { display: none; flex: 1; overflow-y: auto; padding: 15px 15px 100px; }
    .view.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Zima Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 12px; position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .card.active-border { border-left: 4px solid var(--accent); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    
    /* Badge de Estado */
    .badge { font-size: 10px; background: var(--badge-bg); padding: 4px 12px; border-radius: 12px; color: #fff; font-weight: 800; text-transform: capitalize; }
    .badge-sim { color: var(--orange) !important; }
    .badge-sync { color: var(--accent) !important; }

    .path-line { font-size: 10.5px; color: var(--text-dim); margin-bottom: 3px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .path-line b { color: var(--text-dim); min-width: 18px; display: inline-block; opacity: 0.7; }
    .meta-row { color: var(--accent); font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 14px; margin: 12px 0 8px; }
    .last-sync { font-style: italic; font-size: 9.5px; color: var(--text-faint); margin-bottom: 12px; }

    /* Footer Buttons */
    .card-footer { padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
    .btn-action { font-size: 11px; font-weight: 900; text-transform: uppercase; background: none; border: none; display: flex; align-items: center; gap: 6px; }
    .btn-sim { color: var(--orange); }
    .btn-play { color: var(--accent); }
    .btn-stop { color: var(--red); }
    .icon-history { color: var(--text-faint); font-size: 16px; padding: 5px; }

    /* Quota UI */
    .quota-label { font-size: 9px; font-weight: 800; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.5px; }
    .quota-val { font-size: 10px; font-weight: 800; color: var(--text-dim); }
    .prog-bg { background: #070e1e; height: 6px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .prog-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s; }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: var(--bg-nav); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, 1fr); z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-faint); font-size: 10px; font-weight: 700; gap: 4px; text-transform: uppercase; }
    .nav-item.active { color: var(--accent); }
</style>
</head>
<body>

  <div class="topbar">
    <div class="flex items-center gap-3">
        <div id="conn-dot" class="conn-dot"></div>
        <h1 class="font-black uppercase text-sm tracking-tight" style="color: var(--text)">Sync<span style="color: var(--accent)">Pulse</span></h1>
    </div>
    <span class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">ZimaOS Edition</span>
  </div>

  <div class="view active" id="view-home"><div id="home-list"></div></div>
  <div class="view" id="view-clouds"><div id="clouds-list"></div></div>
  <div class="view" id="view-tasks"><div id="tasks-list"></div></div>

  <div class="view" id="view-files">
    <div class="mb-4 text-blue-500 font-bold text-xs" onclick="switchTab('tasks')"><i class="fas fa-arrow-left mr-2"></i> VOLTAR</div>
    <div id="files-header" class="mb-4"></div>
    <div id="files-content"></div>
  </div>

  <div class="view" id="view-history">
    <div class="mb-4 text-blue-500 font-bold text-xs" onclick="switchTab('tasks')"><i class="fas fa-arrow-left mr-2"></i> VOLTAR</div>
    <div id="history-content"></div>
  </div>

  <div class="view" id="view-settings">
    <div class="text-[11px] font-black text-slate-500 uppercase tracking-widest mb-6">Definições</div>
    <div class="bg-[var(--card)] p-5 rounded-2xl border border-[var(--border)] mb-4">
        <span class="quota-label block mb-4">Aparência</span>
        <div class="flex bg-[var(--bg)] p-1 rounded-xl">
            <button id="btn-dark" class="flex-1 py-2 text-[10px] font-bold uppercase rounded-lg" onclick="setTheme('dark')">Escuro</button>
            <button id="btn-light" class="flex-1 py-2 text-[10px] font-bold uppercase rounded-lg" onclick="setTheme('light')">Claro</button>
        </div>
    </div>
    <div class="bg-[var(--card)] p-5 rounded-2xl border border-[var(--border)]">
        <span class="quota-label block mb-4">Idioma</span>
        <div class="grid grid-cols-3 gap-2" id="lang-btns"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="home" onclick="switchTab('home')"><i class="fas fa-house"></i><span>Home</span></div>
    <div class="nav-item" data-tab="clouds" onclick="switchTab('clouds')"><i class="fas fa-cloud"></i><span>Clouds</span></div>
    <div class="nav-item" data-tab="tasks" onclick="switchTab('tasks')"><i class="fas fa-list-check"></i><span>Tarefas</span></div>
    <div class="nav-item" data-tab="settings" onclick="switchTab('settings')"><i class="fas fa-gear"></i><span>Definições</span></div>
  </nav>

<script>
const i18n = {
    en: { nav_home:"Home", nav_clouds:"Clouds", nav_tasks:"Tasks", nav_settings:"Settings", home_title:"Running tasks", clouds_title:"Connected Clouds", clouds_loading:"Loading clouds...", tasks_title:"All Tasks", back:"BACK", status_active:"Active", status_sim:"Simulating", status_inactive:"Inactive", status_done:"Completed", btn_sim:"Simulate", btn_start:"Start", btn_stop:"Stop", last_sync:"Last sync", mode_bi:"Bisync", mode_up:"Upload", mode_down:"Download", opt_real:"Real-time", daily:"Daily", settings_theme:"Appearance", settings_language:"Language", hist_sim:"Simulation", hist_sync:"Sync", hist_success:"Success", hist_error:"Error", file_pending:"Pending" },
    pt: { nav_home:"Home", nav_clouds:"Clouds", nav_tasks:"Tarefas", nav_settings:"Definições", home_title:"Tarefas em execução", clouds_title:"Clouds Ligadas", clouds_loading:"A carregar clouds...", tasks_title:"Todas as tarefas", back:"VOLTAR", status_active:"Ativo", status_sim:"Simulando", status_inactive:"Inativo", status_done:"Concluído", btn_sim:"Simular", btn_start:"Iniciar", btn_stop:"Parar", last_sync:"Última sinc", mode_bi:"Bisync", mode_up:"Local->Cloud", mode_down:"Cloud->Local", opt_real:"Tempo Real", daily:"Diário", settings_theme:"Aparência", settings_language:"Idioma", hist_sim:"Simulação", hist_sync:"Sincronização", hist_success:"Sucesso", hist_error:"Erro", file_pending:"Pendente" },
    es: { nav_home:"Inicio", nav_clouds:"Nubes", nav_tasks:"Tareas", nav_settings:"Ajustes", home_title:"Tareas en curso", clouds_title:"Nubes Conectadas", clouds_loading:"Cargando nubes...", tasks_title:"Todas las tareas", back:"VOLVER", status_active:"Activo", status_sim:"Simulando", status_inactive:"Inactivo", status_done: "Hecho", btn_sim:"Simular", btn_start:"Iniciar", btn_stop:"Parar", last_sync:"Ult. sinc", mode_bi:"Bisync", mode_up:"Subida", mode_down:"Bajada", opt_real:"Tiempo Real", daily:"Diario", settings_theme:"Apariencia", settings_language:"Idioma", hist_sim:"Simulación", hist_sync:"Sincronización", hist_success:"Éxito", hist_error:"Error", file_pending:"Pendiente" },
    fr: { nav_home:"Accueil", nav_clouds:"Clouds", nav_tasks:"Tâches", nav_settings:"Réglages", home_title:"Tâches en cours", clouds_title:"Clouds Connectés", clouds_loading:"Chargement...", tasks_title:"Toutes les tâches", back:"RETOUR", status_active:"Actif", status_sim:"Simulation", status_inactive:"Inactif", status_done: "Terminé", btn_sim:"Simuler", btn_start:"Démarrer", btn_stop:"Arrêter", last_sync:"Dern. sync", mode_bi:"Bisync", mode_up:"Envoi", mode_down:"Réception", opt_real:"Temps Réel", daily:"Quotidien", settings_theme:"Apparence", settings_language:"Langue", hist_sim:"Simulation", hist_sync:"Sinc", hist_success:"Succès", hist_error:"Erreur", file_pending:"En attente" },
    de: { nav_home:"Start", nav_clouds:"Clouds", nav_tasks:"Aufgaben", nav_settings:"Einstellungen", home_title:"Laufende Aufgaben", clouds_title:"Verbundene Clouds", clouds_loading:"Wird geladen...", tasks_title:"Alle Aufgaben", back:"ZURÜCK", status_active:"Aktiv", status_sim:"Simulieren", status_inactive:"Inaktiv", status_done: "Fertig", btn_sim:"Simulieren", btn_start:"Starten", btn_stop:"Stoppen", last_sync:"Letzte Sinc", mode_bi:"Bisync", mode_up:"Upload", mode_down:"Download", opt_real:"Echtzeit", daily:"Täglich", settings_theme:"Aussehen", settings_language:"Sprache", hist_sim:"Simulation", hist_sync:"Sync", hist_success:"Erfolg", hist_error:"Fehler", file_pending:"Ausstehend" }
};

let lang = localStorage.getItem('syncpulse_language_v2') || 'pt';
let theme = localStorage.getItem('syncpulse_theme') || 'dark';
let tasks = [], STATE = { running:{}, stats:{}, active_files:{}, finished_files:{}, all_files:{}, failed_files:{}, skipped_files:{} }, socket, currentTid = null;

function t() { return i18n[lang] || i18n.pt; }

function switchTab(tab) {
    if (tab !== 'files' && tab !== 'history') currentTid = null;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('view-' + tab).classList.add('active');
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    if(tab === 'clouds') loadClouds();
}

function renderCard(tk) {
    const tid = String(tk.id);
    const status = STATE.running[tid] || 'idle';
    const isRunning = status !== 'idle';
    const stats = STATE.stats[tid] || { percent: 0 };
    const activeFile = (STATE.active_files[tid] && STATE.active_files[tid][0]) || null;
    
    const modeLabel = tk.type === 'upload' ? t().mode_up : (tk.type === 'download' ? t().mode_down : t().mode_bi);
    const triggerText = tk.trigger === 'real' ? 'Tempo Real' : tk.interval;

    let statusText = t().status_inactive;
    if (status === 'active') statusText = t().status_active;
    if (status === 'simulating') statusText = t().status_sim;
    if (status === 'idle' && stats.percent === 100) statusText = t().status_done;

    return `
    <div class="card ${isRunning ? 'active-border' : ''}" onclick="openFiles('${tk.id}')">
        <div class="card-header">
            <div class="card-title"><span>${tk.name}</span></div>
            <div class="badge">${statusText}</div>
        </div>
        ${isRunning ? `
            <div class="py-2">
                <div class="path-line" style="color:var(--accent)">${activeFile ? activeFile.name : '...'}</div>
                <div class="prog-bg"><div class="prog-fill" style="width:${stats.percent}%"></div></div>
                <div class="flex justify-between mt-1 text-[9px] font-black uppercase text-slate-500"><span>Progress</span><span>${stats.percent}%</span></div>
            </div>
        ` : `
            <div class="path-line"><b>L:</b>${tk.local}</div>
            <div class="path-line"><b>C:</b>${tk.remote}</div>
            <div class="meta-row"><span><i class="fas fa-rotate"></i> ${modeLabel}</span><span><i class="fas fa-clock"></i> ${triggerText}</span></div>
            <div class="last-sync">${t().last_sync}: ${tk.last_sync || '---'}</div>
        `}
        <div class="card-footer">
            <div class="flex gap-4">
                ${isRunning ? 
                    `<button class="btn-action btn-stop" onclick="event.stopPropagation(); stopSync('${tk.id}')"><i class="fas fa-stop"></i> ${t().btn_stop}</button>` :
                    `<button class="btn-action btn-sim" onclick="event.stopPropagation(); startSync('${tk.id}', true)"><i class="fas fa-flask"></i> ${t().btn_sim}</button>
                     <button class="btn-action btn-play" onclick="event.stopPropagation(); startSync('${tk.id}', false)"><i class="fas fa-play"></i> ${t().btn_start}</button>`
                }
            </div>
            <i class="fas fa-history icon-history" onclick="event.stopPropagation(); showHistory('${tk.id}')"></i>
        </div>
    </div>`;
}

async function loadClouds() {
    const list = document.getElementById('clouds-list');
    list.innerHTML = `<div class="p-10 text-center animate-pulse text-xs text-slate-500 font-bold uppercase">${t().clouds_loading}</div>`;
    const r = await fetch('/api/remotes/list_with_quota');
    const data = await r.json();
    list.innerHTML = data.map(c => {
        const p = c.quota.total ? Math.round((c.quota.used/c.quota.total)*100) : 0;
        const fmt = (b) => (b/1e9).toFixed(1) + " GB";
        return `
        <div class="card">
            <div class="flex justify-between items-center mb-4">
                <div class="card-title"><i class="fab fa-apple text-blue-500"></i><span>${c.name}</span></div>
                <div class="text-blue-400 font-black text-xs">${p}%</div>
            </div>
            <div class="flex justify-between items-end mb-1"><span class="quota-label">Usado</span><span class="quota-val">${fmt(c.quota.used)}</span></div>
            <div class="prog-bg"><div class="prog-fill" style="width:${p}%"></div></div>
            <div class="flex justify-between mt-1"><span class="quota-label">Capacidade</span><span class="quota-val" style="opacity:0.6">${fmt(c.quota.total)}</span></div>
        </div>`;
    }).join('');
}

function openFiles(id) { currentTid = id; switchTab('files'); renderFiles(); }

function renderFiles() {
    const tk = tasks.find(t => String(t.id) === currentTid);
    if(!tk) return;
    document.getElementById('files-header').innerHTML = `<h2 class="text-lg font-black">${tk.name}</h2><p class="text-[9px] text-blue-500 uppercase font-black">${tk.type}</p>`;
    const all = STATE.all_files[currentTid] || [];
    document.getElementById('files-content').innerHTML = all.map(f => {
        let color = "#475569", icon = "fa-clock", lbl = "Pendente";
        if(STATE.finished_files[currentTid]?.includes(f)) { color="var(--green)"; icon="fa-circle-check"; lbl="OK"; }
        if(STATE.failed_files[currentTid]?.includes(f)) { color="var(--red)"; icon="fa-circle-xmark"; lbl="Erro"; }
        if(STATE.skipped_files[currentTid]?.includes(f)) { color="var(--orange)"; icon="fa-equals"; lbl="Inalterado"; }
        const active = STATE.active_files[currentTid]?.find(a => a.name === f);
        if(active) { color="var(--accent)"; icon="fa-sync fa-spin"; lbl=active.progress+"%"; }
        return `<div class="file-row"><span class="text-xs truncate mr-4" style="color:${color}"><i class="fas ${icon} mr-3"></i>${f.split('/').pop()}</span><span class="text-[8px] font-black uppercase" style="color:${color}">${lbl}</span></div>`;
    }).join('') || '<p class="p-10 text-center opacity-30 text-xs">Sem ficheiros</p>';
}

async function showHistory(id) {
    currentTid = id; switchTab('history');
    const r = await fetch(`/api/history/${id}`);
    const data = await r.json();
    document.getElementById('history-content').innerHTML = data.map(h => {
        const isSim = h.type === 'Simulação';
        // Ajuste da operação baseado na lógica pedida
        const opLabel = h.mode === 'upload' ? t().mode_up : (h.mode === 'download' ? t().mode_down : t().mode_bi);
        return `
        <div class="card">
            <div class="flex justify-between items-center mb-2">
                <span class="badge ${isSim ? 'badge-sim' : 'badge-sync'}">${isSim ? t().status_sim : 'Sincronização'}</span>
                <span class="text-[10px] text-slate-500 font-mono">${h.date}</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold" style="color:var(--text)">${opLabel}</span>
                <span class="text-[10px] font-black uppercase" style="color:${h.status==='Sucesso'?'var(--green)':'var(--red)'}">${h.status.toUpperCase()}</span>
            </div>
        </div>`;
    }).join('') || '<p class="p-10 text-center opacity-30 text-xs">Sem histórico</p>';
}

function setTheme(t) {
    theme = t; document.documentElement.setAttribute('data-theme', t); localStorage.setItem('syncpulse_theme', t);
    document.getElementById('btn-dark').className = t === 'dark' ? 'flex-1 py-2 text-[10px] font-bold uppercase rounded-lg bg-blue-600 text-white' : 'flex-1 py-2 text-[10px] font-bold uppercase rounded-lg text-slate-500';
    document.getElementById('btn-light').className = t === 'light' ? 'flex-1 py-2 text-[10px] font-bold uppercase rounded-lg bg-blue-600 text-white' : 'flex-1 py-2 text-[10px] font-bold uppercase rounded-lg text-slate-500';
}

function connect() {
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    socket = new WebSocket(proto + location.host + '/ws');
    socket.onopen = () => document.getElementById('conn-dot').classList.add('online');
    socket.onclose = () => { document.getElementById('conn-dot').classList.remove('online'); setTimeout(connect, 3000); };
    socket.onmessage = (ev) => {
        const d = JSON.parse(ev.data);
        if(d.type === 'init') { tasks = d.tasks; STATE = d.state; }
        if(d.type === 'update') { STATE = d.state; }
        renderHome(); renderTasks();
        if(currentTid && document.getElementById('view-files').classList.contains('active')) renderFiles();
    };
}

async function startSync(id, sim) { await fetch(`/api/sync/${id}?simulate=${sim}`, {method:'POST'}); }
async function stopSync(id) { await fetch(`/api/sync/stop/${id}`, {method:'POST'}); }

window.onload = () => { 
    connect(); setTheme(theme); 
    const langs = ['pt', 'en', 'es', 'fr', 'de'];
    document.getElementById('lang-btns').innerHTML = langs.map(l => `<button class="lang-btn ${l===lang?'active':''}" onclick="lang='${l}';localStorage.setItem('syncpulse_language_v2','${l}');location.reload();">${l.toUpperCase()}</button>`).join('');
};

function renderHome() {
    const list = document.getElementById('home-list');
    const running = tasks.filter(tk => (STATE.running[tk.id] || 'idle') !== 'idle');
    list.innerHTML = running.length ? running.map(tk => renderCard(tk)).join('') : '<p class="p-10 text-center opacity-30 text-xs italic">Nada em execução</p>';
}

function renderTasks() {
    document.getElementById('tasks-list').innerHTML = tasks.map(tk => renderCard(tk)).join('');
}
</script>
</body>
</html>
