<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SyncPulse Mobile</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    :root {
        --bg: #050a12; --bg-nav: #0b111d; --card: #111d29; --card-alt: #162635;
        --border: #1e293b; --text: #ffffff; --text-dim: #94a3b8; --text-faint: #475569;
        --accent: #3b82f6; --orange: #f97316; --green: #22c55e; --red: #ef4444;
    }
    html[data-theme="light"] {
        --bg: #eef1f6; --bg-nav: #ffffff; --card: #ffffff; --card-alt: #f1f5f9;
        --border: #cbd5e1; --text: #0f172a; --text-dim: #475569; --text-faint: #94a3b8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    *::-webkit-scrollbar { display: none; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s; }

    /* UI Components */
    .topbar { padding: 20px; background: var(--bg-nav); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
    .conn-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }

    .view { display: none; flex: 1; overflow-y: auto; padding: 20px 20px 100px; }
    .view.active { display: block; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 15px; position: relative; border-left: 4px solid transparent; }
    .card.active-border { border-left-color: var(--accent); background: var(--card-alt); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .badge { font-size: 10px; background: #1e293b; padding: 4px 12px; border-radius: 12px; color: #fff; font-weight: 800; }
    
    .path-line { font-size: 10px; color: var(--text-faint); margin-bottom: 3px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta-row { color: var(--accent); font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 14px; margin: 12px 0 8px; }

    .card-footer { padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
    .btn-action { font-size: 10.5px; font-weight: 900; text-transform: uppercase; background: none; border: none; display: flex; align-items: center; gap: 6px; }

    /* Progress UI */
    .prog-bg { background: #070e1e; height: 6px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .prog-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s; }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: var(--bg-nav); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, 1fr); z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-faint); font-size: 9px; font-weight: 700; text-transform: uppercase; gap: 4px; border:none; background:none; }
    .nav-item.active { color: var(--accent); }

    /* Settings Buttons Fix */
    .settings-group { background: var(--card); border-radius: 18px; padding: 20px; border: 1px solid var(--border); margin-bottom: 15px; }
    .theme-toggle { display: flex; background: var(--bg); padding: 4px; border-radius: 12px; gap: 4px; }
    .theme-btn { flex: 1; padding: 12px; border-radius: 8px; font-size: 11px; font-weight: 800; color: var(--text-dim); border:none; background:transparent; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .theme-btn.active { background: var(--accent); color: white; }
    .lang-btn { padding: 15px 5px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text-dim); font-weight: 800; font-size: 11px; }
    .lang-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.1); }
</style>
</head>
<body>

  <div class="topbar">
    <div class="flex items-center gap-3">
        <div id="conn-dot" class="conn-dot"></div>
        <div>
            <h1 class="font-black uppercase text-sm tracking-tight" style="color: var(--text)">Sync<span style="color: var(--accent)">Pulse</span></h1>
            <span class="text-[8px] text-slate-500 font-bold uppercase tracking-widest">Mobile Edition</span>
        </div>
    </div>
  </div>

  <div class="view active" id="view-home"><div class="section-title" data-i18n="home_title">Tarefas em execução</div><div id="home-list"></div></div>
  <div class="view" id="view-clouds"><div class="section-title" data-i18n="clouds_title">Clouds Ligadas</div><div id="clouds-list"></div></div>
  <div class="view" id="view-tasks"><div class="section-title" data-i18n="tasks_title">Todas as tarefas</div><div id="tasks-list"></div></div>

  <!-- SUB-PÁGINAS -->
  <div class="view" id="view-files">
    <div class="mb-4 text-blue-500 font-bold text-xs" onclick="switchTab('tasks')"><i class="fas fa-arrow-left mr-2"></i> <span data-i18n="back">VOLTAR</span></div>
    <div id="files-header" class="mb-4"></div>
    <div id="file-list-content"></div>
  </div>

  <div class="view" id="view-history">
    <div class="mb-4 text-blue-500 font-bold text-xs" onclick="switchTab('tasks')"><i class="fas fa-arrow-left mr-2"></i> <span data-i18n="back">VOLTAR</span></div>
    <div class="section-title" data-i18n="hist_title">Histórico de Atividade</div>
    <div id="history-content"></div>
  </div>

  <!-- DEFINIÇÕES -->
  <div class="view" id="view-settings">
    <div class="section-title" data-i18n="nav_settings">Definições</div>
    <div class="settings-group">
        <div class="text-[9px] font-bold text-slate-500 uppercase mb-4" data-i18n="settings_theme">Aparência</div>
        <div class="theme-toggle">
            <button id="t-dark" class="theme-btn" onclick="setTheme('dark')"><i class="fas fa-moon"></i><span data-i18n="theme_dark">Escuro</span></button>
            <button id="t-light" class="theme-btn" onclick="setTheme('light')"><i class="fas fa-sun"></i><span data-i18n="theme_light">Claro</span></button>
        </div>
    </div>
    <div class="settings-group">
        <div class="text-[9px] font-bold text-slate-500 uppercase mb-4" data-i18n="settings_language">Idioma</div>
        <div class="grid grid-cols-3 gap-2" id="lang-btns"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="home" onclick="switchTab('home')"><i class="fas fa-house"></i><span data-i18n="nav_home">Home</span></button>
    <button class="nav-item" data-tab="clouds" onclick="switchTab('clouds')"><i class="fas fa-cloud"></i><span data-i18n="nav_clouds">Clouds</span></button>
    <button class="nav-item" data-tab="tasks" onclick="switchTab('tasks')"><i class="fas fa-list-check"></i><span data-i18n="nav_tasks">Tarefas</span></button>
    <button class="nav-item" data-tab="settings" onclick="switchTab('settings')"><i class="fas fa-gear"></i><span data-i18n="nav_settings">Menu</span></button>
  </nav>

<script>
const i18n = {
    en: { nav_home: "Home", nav_clouds: "Clouds", nav_tasks: "Tasks", nav_settings: "Settings", home_title: "Running tasks", clouds_title: "Connected Clouds", clouds_loading: "Loading clouds...", tasks_title: "All Tasks", back: "BACK", status_active: "Active", status_sim: "Simulation", status_inactive: "Inactive", status_done: "Completed", btn_sim: "Simulate", btn_start: "Start", btn_stop: "Stop", last_sync: "Last sync", mode_bi: "Bisync", mode_up: "Local->Cloud", mode_down: "Cloud->Local", settings_theme: "Appearance", settings_language: "Language", theme_dark: "Dark", theme_light: "Light", hist_title: "History", hist_sim: "Simulation", hist_sync: "Sync", hist_success: "Success", hist_error: "Error", file_pending: "Pending" },
    pt: { nav_home: "Home", nav_clouds: "Clouds", nav_tasks: "Tarefas", nav_settings: "Definições", home_title: "Tarefas em execução", clouds_title: "Clouds Ligadas", clouds_loading: "A carregar...", tasks_title: "Todas as tarefas", back: "VOLTAR", status_active: "Ativo", status_sim: "Simulação", status_inactive: "Inativo", status_done: "Concluído", btn_sim: "Simular", btn_start: "Iniciar", btn_stop: "Parar", last_sync: "Última sinc", mode_bi: "Bisync", mode_up: "Local->Cloud", mode_down: "Cloud->Local", settings_theme: "Aparência", settings_language: "Idioma", theme_dark: "Escuro", theme_light: "Claro", hist_title: "Histórico", hist_sim: "Simulação", hist_sync: "Sinc", hist_success: "Sucesso", hist_error: "Erro", file_pending: "Pendente" },
    es: { nav_home: "Inicio", nav_clouds: "Nubes", nav_tasks: "Tareas", nav_settings: "Ajustes", home_title: "Tareas en curso", clouds_title: "Nubes Conectadas", clouds_loading: "Cargando...", tasks_title: "Todas las tareas", back: "VOLVER", status_active: "Activo", status_sim: "Simulando", status_inactive: "Inactivo", status_done: "Hecho", btn_sim: "Simular", btn_start: "Iniciar", btn_stop: "Parar", last_sync: "Ult. sinc", mode_bi: "Bisync", mode_up: "Subida", mode_down: "Bajada", settings_theme: "Apariencia", settings_language: "Idioma", theme_dark: "Oscuro", theme_light: "Claro", hist_title: "Historial", hist_sim: "Simulación", hist_sync: "Sinc", hist_success: "Éxito", hist_error: "Error", file_pending: "Pendiente" },
    fr: { nav_home: "Accueil", nav_clouds: "Clouds", nav_tasks: "Tâches", nav_settings: "Réglages", home_title: "Tâches en cours", clouds_title: "Clouds Connectés", clouds_loading: "Chargement...", tasks_title: "Toutes les tâches", back: "RETOUR", status_active: "Actif", status_sim: "Simulation", status_inactive: "Inactif", status_done: "Terminé", btn_sim: "Simuler", btn_start: "Démarrer", btn_stop: "Arrêter", last_sync: "Dern. sync", mode_bi: "Bisync", mode_up: "Envoi", mode_down: "Réception", settings_theme: "Apparence", settings_language: "Langue", theme_dark: "Sombre", theme_light: "Clair", hist_title: "Historique", hist_sim: "Simulation", hist_sync: "Sinc", hist_success: "Succès", hist_error: "Erreur", file_pending: "En attente" },
    de: { nav_home: "Start", nav_clouds: "Clouds", nav_tasks: "Aufgaben", nav_settings: "Einstellungen", home_title: "Laufende Aufgaben", clouds_title: "Verbundene Clouds", clouds_loading: "Wird geladen...", tasks_title: "Alle Aufgaben", back: "ZURÜCK", status_active: "Aktiv", status_sim: "Simulieren", status_inactive: "Inaktiv", status_done: "Fertig", btn_sim: "Simulieren", btn_start: "Starten", btn_stop: "Stoppen", last_sync: "Letzte Sinc", mode_bi: "Bisync", mode_up: "Upload", mode_down: "Download", settings_theme: "Aussehen", settings_language: "Sprache", theme_dark: "Dunkel", theme_light: "Hell", hist_title: "Verlauf", hist_sim: "Simulation", hist_sync: "Sync", hist_success: "Erfolg", hist_error: "Fehler", file_pending: "Ausstehend" }
};

let lang = localStorage.getItem('syncpulse_language_v2') || 'en';
let theme = localStorage.getItem('syncpulse_theme') || 'dark';
let tasks = [], STATE = { running:{}, stats:{}, active_files:{}, finished_files:{}, all_files:{}, failed_files:{}, skipped_files:{} }, socket, currentTid = null;

function t() { return i18n[lang] || i18n.en; }

/* --- Navegação --- */
function switchTab(tab) {
    if (tab !== 'files' && tab !== 'history') currentTid = null;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    const viewId = (tab === 'settings') ? 'view-settings' : 'view-' + tab;
    const view = document.getElementById(viewId);
    if(view) view.classList.add('active');
    
    const nav = document.querySelector(`[data-tab="${tab}"]`);
    if(nav) nav.classList.add('active');
    
    if(tab === 'clouds') loadClouds();
}

function openFiles(id) { currentTid = id; switchTab('files'); renderFiles(); }

function renderCard(tk) {
    const tid = String(tk.id);
    const status = STATE.running[tid] || 'idle';
    const isRunning = status !== 'idle';
    const stats = STATE.stats[tid] || { percent: 0 };
    const activeFile = (STATE.active_files[tid] && STATE.active_files[tid][0]) || null;
    const hasErrors = STATE.failed_files[tid]?.length > 0;
    const modeLabel = tk.type === 'upload' ? t().mode_up : (tk.type === 'download' ? t().mode_down : t().mode_bi);

    let statusText = t().status_inactive;
    if (status === 'active') statusText = t().status_active;
    if (status === 'simulating') statusText = t().status_sim;
    if (status === 'idle' && stats.percent === 100) statusText = t().status_done;

    return `
    <div class="card ${isRunning ? 'active-border' : ''}" onclick="openFiles('${tk.id}')">
        <div class="card-header">
            <div class="card-title"><div class="status-dot ${isRunning ? 'active' : ''}"></div><span>${tk.name}</span></div>
            <div class="flex items-center gap-2">
                ${hasErrors ? '<i class="fas fa-triangle-exclamation text-orange-500 text-[12px]"></i>' : ''}
                <div class="badge">${statusText}</div>
            </div>
        </div>
        ${isRunning ? `
            <div class="py-2">
                <div class="path-line" style="color:var(--accent)">${activeFile ? activeFile.name : '...'}</div>
                <div class="prog-bg"><div class="prog-fill" style="width:${stats.percent}%"></div></div>
                <div class="flex justify-between mt-1 text-[9px] font-black uppercase text-slate-500"><span>Progress</span><span>${stats.percent}%</span></div>
            </div>
        ` : `
            <div class="path-line"><b>L:</b>${tk.local}</div>
            <div class="path-line"><b>C:</b>${tk.remote}</div>
            <div class="meta-row"><span><i class="fas fa-rotate"></i> ${modeLabel}</span><span><i class="fas fa-clock"></i> ${tk.interval || 'Tempo Real'}</span></div>
            <div class="last-sync">${t().last_sync}: ${tk.last_sync || '---'}</div>
        `}
        <div class="card-footer">
            <div class="flex gap-4">
                ${isRunning ? 
                    `<button class="btn-action" style="color:var(--red)" onclick="event.stopPropagation(); stopSync('${tk.id}')"><i class="fas fa-stop"></i> ${t().btn_stop}</button>` :
                    `<button class="btn-action btn-sim" onclick="event.stopPropagation(); startSync('${tk.id}', true)"><i class="fas fa-flask"></i> ${t().btn_sim}</button>
                     <button class="btn-action btn-play" onclick="event.stopPropagation(); startSync('${tk.id}', false)"><i class="fas fa-play"></i> ${t().btn_start}</button>`
                }
            </div>
            <i class="fas fa-history icon-history" onclick="event.stopPropagation(); showHistory('${tk.id}')"></i>
        </div>
    </div>`;
}

function renderFiles() {
    const tk = tasks.find(t => String(t.id) === String(currentTid));
    const container = document.getElementById('file-list-content');
    if(!tk || !container) return;
    document.getElementById('files-header').innerHTML = `<h2 class="text-xl font-black">${tk.name}</h2><p class="text-[9px] text-blue-500 uppercase font-black">${tk.type}</p>`;
    const all = STATE.all_files[currentTid] || [];
    container.innerHTML = all.map(f => {
        let color = "#475569", icon = "fa-clock", lbl = t().file_pending;
        if(STATE.finished_files[currentTid]?.includes(f)) { color="var(--green)"; icon="fa-circle-check"; lbl="OK"; }
        if(STATE.failed_files[currentTid]?.includes(f)) { color="var(--red)"; icon="fa-circle-xmark"; lbl="Erro"; }
        if(STATE.skipped_files[currentTid]?.includes(f)) { color="var(--orange)"; icon="fa-equals"; lbl="Inalterado"; }
        const active = STATE.active_files[currentTid]?.find(a => a.name === f);
        if(active) { color="var(--accent)"; icon="fa-sync fa-spin"; lbl=active.progress+"%"; }
        return `<div class="file-row"><span class="text-xs truncate mr-4" style="color:${color}"><i class="fas ${icon} mr-3"></i>${f.split('/').pop()}</span><span class="text-[8px] font-black uppercase" style="color:${color}">${lbl}</span></div>`;
    }).join('') || '<p class="p-10 text-center opacity-30 text-xs">Sem ficheiros</p>';
}

async function showHistory(id) {
    currentTid = id; switchTab('history');
    const tk = tasks.find(t => String(t.id) === String(id));
    document.getElementById('history-header').innerHTML = `<h3 class="font-black text-lg">${tk ? tk.name : ''}</h3>`;
    const r = await fetch(`/api/history/${id}`);
    const data = await r.json();
    document.getElementById('history-content').innerHTML = data.map(h => {
        const isSim = h.type === 'Simulação';
        const opLabel = h.mode === 'upload' ? t().mode_up : (h.mode === 'download' ? t().mode_down : t().mode_bi);
        return `
        <div class="card">
            <div class="flex justify-between items-center mb-2">
                <span class="badge" style="color:${isSim?'var(--orange)':'var(--accent)'}">${isSim ? t().status_sim : t().hist_sync}</span>
                <span class="text-[10px] text-slate-500 font-mono">${h.date}</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold">${opLabel}</span>
                <span class="text-[10px] font-black uppercase" style="color:${h.status==='Sucesso'?'var(--green)':'var(--red)'}">${h.status.toUpperCase()}</span>
            </div>
        </div>`;
    }).join('') || '<p class="p-10 text-center opacity-30 text-xs">Sem histórico</p>';
}

async function loadClouds() {
    const list = document.getElementById('clouds-list');
    list.innerHTML = `<div class="p-10 text-center animate-pulse text-xs text-slate-500 font-bold uppercase">${t().clouds_loading}</div>`;
    const r = await fetch('/api/remotes/list_with_quota');
    const data = await r.json();
    list.innerHTML = data.map(c => {
        const p = c.quota.total ? Math.round((c.quota.used/c.quota.total)*100) : 0;
        const fmt = (b) => (b/1e9).toFixed(1) + " GB";
        return `<div class="card"><div class="flex justify-between items-center mb-3"><div class="flex items-center gap-3"><i class="fab fa-${getIcon(c.type)} text-blue-500"></i><span class="font-bold text-sm text-white">${c.name}</span></div><span class="text-blue-400 font-black text-xs">${p}%</span></div><div class="flex justify-between items-end mb-1"><span class="text-[9px] font-black text-slate-500 uppercase">Usado</span><span class="text-blue-400 font-black text-[10px]">${fmt(c.quota.used)}</span></div><div class="prog-bg"><div class="prog-fill" style="width:${p}%"></div></div><div class="flex justify-between mt-1"><span class="text-[9px] font-black text-slate-500 uppercase">Capacidade</span><span class="text-slate-400 font-bold text-[10px]">${fmt(c.quota.total)}</span></div></div>`;
    }).join('');
}

function setTheme(t) {
    theme = t; document.documentElement.setAttribute('data-theme', t); localStorage.setItem('syncpulse_theme', t);
    document.getElementById('btn-dark').className = t === 'dark' ? 'theme-btn active' : 'theme-btn';
    document.getElementById('btn-light').className = t === 'light' ? 'theme-btn active' : 'theme-btn';
}
function setLang(l) { lang = l; localStorage.setItem('syncpulse_language_v2', l); translateUI(); renderAll(); }
function translateUI() { document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.dataset.i18n; if(t()[k]) el.textContent = t()[k]; }); }

function connect() {
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    socket = new WebSocket(proto + location.host + '/ws');
    socket.onopen = () => document.getElementById('conn-dot').classList.add('online');
    socket.onclose = () => { document.getElementById('conn-dot').classList.remove('online'); setTimeout(connect, 3000); };
    socket.onmessage = (ev) => {
        const d = JSON.parse(ev.data);
        if(d.type === 'init') { tasks = d.tasks; STATE = d.state; translateUI(); }
        if(d.type === 'update') { STATE = d.state; }
        renderHome(); renderTasks();
        if(currentTid && document.getElementById('view-files').classList.contains('active')) renderFiles();
    };
}

function renderHome() { document.getElementById('home-list').innerHTML = tasks.filter(tk => (STATE.running[tk.id] || 'idle') !== 'idle').map(renderCard).join('') || '<p class="p-10 text-center opacity-30 text-xs italic">Nada em execução</p>'; }
function renderTasks() { document.getElementById('tasks-list').innerHTML = tasks.map(renderCard).join(''); }
async function startSync(id, sim) { await fetch(`/api/sync/${id}?simulate=${sim}`, {method:'POST'}); }
async function stopSync(id) { await fetch(`/api/sync/stop/${id}`, {method:'POST'}); }
function getIcon(t) { t=t.toLowerCase(); if(t.includes('drive')) return 'google-drive'; if(t.includes('dropbox')) return 'dropbox'; if(t.includes('onedrive')) return 'microsoft'; if(t.includes('mega')) return 'cloud'; return 'cloud'; }

window.onload = () => {
    connect(); setTheme(theme);
    const langs = ['pt','en','es','fr','de'];
    document.getElementById('lang-btns').innerHTML = langs.map(l => `<button class="lang-btn ${l===lang?'active':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('');
};
</script>
</body>
</html>
