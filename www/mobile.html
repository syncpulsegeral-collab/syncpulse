<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SyncPulse - Mobile</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #050a12;
    --bg-elevated: #0b111d;
    --card: #111d29;
    --card-alt: #162635;
    --border: #1e293b;
    --text: #ffffff;
    --text-dim: #94a3b8;
    --text-faint: #475569;
    --accent: #3b82f6;
    --accent-dim: rgba(59,130,246,0.12);
    --orange: #f97316;
    --green: #22c55e;
    --red: #ef4444;
  }
  html[data-theme="light"] {
    --bg: #eef1f6;
    --bg-elevated: #ffffff;
    --card: #ffffff;
    --card-alt: #eaf1ff;
    --border: #e1e7ef;
    --text: #0f172a;
    --text-dim: #5b6b82;
    --text-faint: #94a3b8;
    --accent: #2563eb;
    --accent-dim: rgba(37,99,235,0.1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: background 0.25s, color 0.25s;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(16px, env(safe-area-inset-top)) 18px 14px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }
  .topbar-title { display: flex; align-items: center; gap: 10px; }
  .topbar-title h1 { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .topbar-title span { font-size: 9px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex-shrink: 0; transition: background 0.3s; }
  .conn-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }

  /* ---------- Views ---------- */
  .view { display: none; flex: 1; overflow-y: auto; padding: 16px 16px 90px; }
  .view.active { display: block; }
  .section-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 4px 0 12px; }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text-faint);
    border: 2px dashed var(--border); border-radius: 18px; font-size: 12px; font-weight: 700;
  }
  .empty-state i { font-size: 26px; display: block; margin-bottom: 10px; color: var(--text-faint); }

  /* ---------- Task cards (shared Home + Tarefas) ---------- */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 12px; border-left: 3px solid transparent;
  }
  .card.running { border-left-color: var(--accent); background: var(--card-alt); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
  .card-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 9px; min-width: 0; }
  .card-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
  .status-dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .badge { font-size: 10px; background: var(--accent-dim); padding: 3px 10px; border-radius: 15px; color: var(--text-dim); font-weight: 800; white-space: nowrap; }

  .path-line { font-size: 10.5px; color: var(--text-faint); margin-bottom: 3px; font-family: 'SF Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .path-line b { color: var(--text-dim); margin-right: 4px; }

  .meta-row { color: var(--accent); font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 14px; margin: 12px 0 8px; }
  .meta-row i { font-size: 10px; }
  .last-sync { font-style: italic; font-size: 9.5px; color: var(--text-faint); margin-bottom: 10px; }

  .progress-wrap { margin: 10px 0; }
  .progress-file { font-size: 10px; color: var(--text-dim); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog-bg { background: rgba(148,163,184,0.12); height: 6px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
  .prog-fill { background: var(--accent); height: 100%; width: 0%; border-radius: 4px; transition: width 0.4s; box-shadow: 0 0 8px rgba(59,130,246,0.5); }

  .card-footer { padding-top: 12px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .btn-action { font-size: 10.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; text-transform: uppercase; padding: 7px 12px; border-radius: 8px; background: transparent; border: none; }
  .btn-sim { color: var(--orange); }
  .btn-play { color: var(--accent); }
  .btn-stop { color: var(--red); }
  .btn-action.disabled { opacity: 0.35; }
  .icon-history { color: var(--text-faint); font-size: 14px; padding: 6px; }

  /* ---------- Cloud cards ---------- */
  .cloud-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .cloud-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .cloud-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-dim); display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; }
  .cloud-name { font-size: 13.5px; font-weight: 800; }
  .cloud-type { font-size: 9px; color: var(--text-faint); text-transform: uppercase; font-weight: 800; letter-spacing: 0.06em; }
  .quota-row { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; margin-bottom: 6px; }
  .quota-row .used { color: var(--accent); font-weight: 800; }
  .quota-row .label { color: var(--text-dim); text-transform: uppercase; font-size: 9.5px; }
  .quota-foot { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--text-faint); font-weight: 700; margin-top: 6px; }

  /* ---------- Settings ---------- */
  .settings-block { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .settings-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 12px; }
  .theme-toggle { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 4px; gap: 4px; }
  .theme-opt { flex: 1; text-align: center; padding: 10px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--text-dim); display: flex; align-items: center; justify-content: center; gap: 7px; }
  .theme-opt.active { background: var(--accent); color: #fff; }
  .lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .lang-opt { padding: 12px 6px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); text-align: center; font-size: 11px; font-weight: 800; color: var(--text-dim); }
  .lang-opt.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* ---------- Bottom nav ---------- */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex;
    background: var(--bg-elevated); border-top: 1px solid var(--border);
    padding: 8px 6px max(8px, env(safe-area-inset-bottom));
    z-index: 50;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px 0; color: var(--text-faint); background: none; border: none; font-family: inherit;
  }
  .nav-item i { font-size: 17px; }
  .nav-item span { font-size: 9.5px; font-weight: 700; }
  .nav-item.active { color: var(--accent); }

  /* ---------- Modals (Histórico / Ficheiros) ---------- */
  .card { cursor: pointer; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-sheet {
    background: var(--bg-elevated); border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0; width: 100%; max-width: 560px;
    max-height: 82vh; display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(.32,.72,0,1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 18px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 12px;
  }
  .modal-head h3 {
    font-size: 13.5px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 9px;
    min-width: 0; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .modal-head h3 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-head i.fa-history, .modal-head i.fa-folder-open { color: var(--accent); font-size: 14px; flex-shrink: 0; }
  .modal-close { color: var(--text-faint); font-size: 20px; background: none; border: none; padding: 4px; flex-shrink: 0; line-height: 1; }
  .modal-body { overflow-y: auto; padding: 16px 18px 24px; flex: 1; }
  .modal-body.hidden { display: none; }
  .modal-empty { text-align: center; padding: 50px 10px; color: var(--text-faint); font-size: 12px; font-weight: 700; }
  .modal-empty i { font-size: 24px; display: block; margin-bottom: 10px; }

  /* Abas do modal de Ficheiros/Log */
  .modal-tabs { display: flex; gap: 4px; padding: 10px 14px 0; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .modal-tab {
    flex: 1; background: none; border: none; font-family: inherit; cursor: pointer;
    color: var(--text-faint); font-size: 10.5px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 10px 6px; display: flex; align-items: center; justify-content: center;
    gap: 6px; border-bottom: 2px solid transparent;
  }
  .modal-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Terminal de log */
  .log-line { font-family: 'SF Mono', monospace; font-size: 9.5px; color: var(--green); margin-bottom: 5px; line-height: 1.5; word-break: break-all; }
  .log-placeholder { font-family: 'SF Mono', monospace; font-size: 10px; color: var(--text-faint); opacity: 0.7; line-height: 1.7; }

  /* Histórico entries */
  .hist-entry { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; margin-bottom: 10px; }
  .hist-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hist-date { color: var(--text-faint); font-family: 'SF Mono', monospace; font-size: 10px; font-weight: 600; }
  .hist-type { font-size: 8.5px; font-weight: 800; text-transform: uppercase; padding: 3px 9px; border-radius: 10px; letter-spacing: 0.04em; }
  .hist-type.sim { background: rgba(249,115,22,0.14); color: var(--orange); border: 1px solid rgba(249,115,22,0.3); }
  .hist-type.sync { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(59,130,246,0.3); }
  .hist-mid { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
  .hist-mode { color: var(--text-dim); font-weight: 700; font-size: 10.5px; }
  .hist-mode i { color: var(--text-faint); margin-right: 5px; }
  .hist-status { font-weight: 800; font-size: 10px; display: flex; align-items: center; gap: 5px; text-transform: uppercase; white-space: nowrap; }
  .hist-status.ok { color: var(--green); }
  .hist-status.err { color: var(--red); }
  .hist-err-btn {
    margin-top: 10px; font-size: 8.5px; font-weight: 800; text-transform: uppercase;
    background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.2);
    padding: 5px 10px; border-radius: 6px; letter-spacing: 0.04em;
  }
  .hist-log {
    background: rgba(0,0,0,0.35); padding: 10px; border-radius: 8px; margin-top: 8px;
    font-family: 'SF Mono', monospace; font-size: 9.5px; color: var(--red);
    white-space: pre-wrap; max-height: 200px; overflow-y: auto; border: 1px solid rgba(239,68,68,0.15);
  }
  .hist-log.hidden { display: none; }

  /* Lista de ficheiros (fxs) */
  .file-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .file-row:last-child { border-bottom: none; }
  .file-icon { width: 16px; text-align: center; flex-shrink: 0; font-size: 12px; }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 11px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-path { font-size: 9px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .file-mini-bar { height: 3px; border-radius: 2px; background: rgba(148,163,184,0.14); margin-top: 6px; overflow: hidden; }
  .file-mini-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
  .file-status { font-size: 8.5px; font-weight: 800; text-transform: uppercase; flex-shrink: 0; text-align: right; white-space: nowrap; letter-spacing: 0.03em; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-title">
      <div class="conn-dot" id="conn-dot"></div>
      <div>
        <h1>SyncPulse</h1>
        <span>ZimaOS Edition</span>
      </div>
    </div>
  </div>

  <!-- HOME -->
  <div class="view active" id="view-home">
    <div class="section-title" data-i18n="home_title">Tarefas em execução</div>
    <div id="home-list"></div>
  </div>

  <!-- CLOUDS -->
  <div class="view" id="view-clouds">
    <div class="section-title" data-i18n="clouds_title">Clouds ligadas</div>
    <div id="clouds-list"></div>
  </div>

  <!-- TAREFAS -->
  <div class="view" id="view-tasks">
    <div class="section-title" data-i18n="tasks_title">Todas as tarefas</div>
    <div id="tasks-list"></div>
  </div>

  <!-- DEFINIÇÕES -->
  <div class="view" id="view-settings">
    <div class="section-title" data-i18n="settings_title">Definições</div>

    <div class="settings-block">
      <div class="settings-label" data-i18n="settings_theme">Aparência</div>
      <div class="theme-toggle">
        <button class="theme-opt" id="opt-dark" onclick="setTheme('dark')"><i class="fas fa-moon"></i> <span data-i18n="theme_dark">Escuro</span></button>
        <button class="theme-opt" id="opt-light" onclick="setTheme('light')"><i class="fas fa-sun"></i> <span data-i18n="theme_light">Claro</span></button>
      </div>
    </div>

    <div class="settings-block">
      <div class="settings-label" data-i18n="settings_language">Idioma</div>
      <div class="lang-grid" id="lang-grid"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
      <i class="fas fa-house"></i><span data-i18n="nav_home">Home</span>
    </button>
    <button class="nav-item" data-tab="clouds" onclick="switchTab('clouds')">
      <i class="fas fa-cloud"></i><span data-i18n="nav_clouds">Clouds</span>
    </button>
    <button class="nav-item" data-tab="tasks" onclick="switchTab('tasks')">
      <i class="fas fa-list-check"></i><span data-i18n="nav_tasks">Tarefas</span>
    </button>
    <button class="nav-item" data-tab="settings" onclick="switchTab('settings')">
      <i class="fas fa-gear"></i><span data-i18n="nav_settings">Definições</span>
    </button>
  </div>

  <!-- MODAL HISTÓRICO -->
  <div class="modal-overlay" id="mHistory" onclick="if(event.target===this) closeModal('mHistory')">
    <div class="modal-sheet">
      <div class="modal-head">
        <h3><i class="fas fa-history"></i><span id="history-title" data-i18n="hist_title">Histórico de Atividade</span></h3>
        <button class="modal-close" onclick="closeModal('mHistory')">&times;</button>
      </div>
      <div class="modal-body" id="history-body"></div>
    </div>
  </div>

  <!-- MODAL LISTA DE FICHEIROS -->
  <div class="modal-overlay" id="mFiles" onclick="if(event.target===this) closeModal('mFiles')">
    <div class="modal-sheet">
      <div class="modal-head">
        <h3><i class="fas fa-folder-open"></i><span id="files-title">Ficheiros</span></h3>
        <button class="modal-close" onclick="closeModal('mFiles')">&times;</button>
      </div>
      <div class="modal-tabs">
        <button class="modal-tab active" id="tab-btn-files" onclick="switchFilesTab('files')"><i class="fas fa-list"></i> <span data-i18n="tab_files">Ficheiros</span></button>
        <button class="modal-tab" id="tab-btn-log" onclick="switchFilesTab('log')"><i class="fas fa-terminal"></i> <span data-i18n="tab_log">Log</span></button>
      </div>
      <div class="modal-body" id="files-body"></div>
      <div class="modal-body hidden" id="log-body"></div>
    </div>
  </div>

    tasks_title:"Toutes les tâches", tasks_empty:"Aucune tâche créée",
    settings_title:"Réglages", settings_theme:"Apparence", theme_dark:"Sombre", theme_light:"Clair", settings_language:"Langue",
    mode_up:"Local→Cloud", mode_down:"Cloud→Local", mode_bi:"Bidirectionnel",
    status_active:"Actif", status_sim:"Simulation", status_inactive:"Inactif", status_done:"Terminé",
    last_sync:"Dern. sync.", btn_simulate:"Simuler", btn_start:"Démarrer", btn_stop:"Arrêter", opt_real:"Temps réel", daily:"Quotidien",
    hist_title:"Historique d'activité", hist_empty:"Aucun enregistrement.", hist_view_err:"Voir l'erreur", hist_success:"Succès", hist_error:"Erreur", hist_sim:"Simulation", hist_sync:"Synchronisation",
    files_title:"File d'attente", file_pending:"EN ATTENTE", file_skipped:"AUCUN CHANGEMENT", file_error:"ERREUR", file_done:"TERMINÉ",
    tab_files:"Fichiers", tab_log:"Journal", log_empty:"En attente d'activité..." },
  de: { nav_home:"Start", nav_clouds:"Clouds", nav_tasks:"Aufgaben", nav_settings:"Einstellungen",
    home_title:"Laufende Aufgaben", home_empty_title:"Nichts läuft", home_empty_sub:"Aktive Aufgaben erscheinen hier in Echtzeit.",
    clouds_title:"Verbundene Clouds", clouds_used:"Belegt", clouds_total:"Gesamt", clouds_empty:"Keine Clouds konfiguriert", clouds_loading:"Clouds werden geladen...", clouds_error:"Server nicht erreichbar.",
    tasks_title:"Alle Aufgaben", tasks_empty:"Noch keine Aufgaben erstellt",
    settings_title:"Einstellungen", settings_theme:"Erscheinungsbild", theme_dark:"Dunkel", theme_light:"Hell", settings_language:"Sprache",
    mode_up:"Lokal→Cloud", mode_down:"Cloud→Lokal", mode_bi:"Bidirektional",
    status_active:"Aktiv", status_sim:"Simulation", status_inactive:"Inaktiv", status_done:"Fertig",
    last_sync:"Letzte Sync.", btn_simulate:"Simulieren", btn_start:"Starten", btn_stop:"Stoppen", opt_real:"Echtzeit", daily:"Täglich",
    hist_title:"Aktivitätsverlauf", hist_empty:"Keine Einträge gefunden.", hist_view_err:"Fehler anzeigen", hist_success:"Erfolgreich", hist_error:"Fehler", hist_sim:"Simulation", hist_sync:"Synchronisierung",
    files_title:"Warteschlange", file_pending:"AUSSTEHEND", file_skipped:"KEINE ÄNDERUNG", file_error:"FEHLER", file_done:"FERTIG",
    tab_files:"Dateien", tab_log:"Protokoll", log_empty:"Warte auf Aktivität..." }
};
const LANG_LABELS = { pt:"PT", en:"EN", es:"ES", fr:"FR", de:"DE" };

let lang = localStorage.getItem('syncpulse_language_v2') || 'pt';
if (!i18n[lang]) lang = 'pt';
let theme = localStorage.getItem('syncpulse_theme') || 'dark';

let tasks = [];
let STATE = { running:{}, stats:{}, active_files:{}, failed_files:{}, finished_files:{}, all_files:{}, skipped_files:{}, file_sizes:{}, logs:{}, license_active:false };
let socket;
let currentFilesTaskId = null;
let currentFilesTab = 'files';

/* ==================== Helpers ==================== */
function t() { return i18n[lang] || i18n.pt; }

function formatSize(bytes) {
  if (!bytes || bytes === 0) return "0 B";
  const i = Math.floor(Math.log(bytes) / Math.log(1024));
  return (bytes / Math.pow(1024, i)).toFixed(1) + " " + ['B','KB','MB','GB','TB'][i];
}

function getIcon(type) {
  if (!type) return 'cloud';
  type = type.toLowerCase();
  if (type.includes('drive')) return 'google-drive';
  if (type.includes('dropbox')) return 'dropbox';
  if (type.includes('onedrive')) return 'microsoft';
  if (type.includes('box')) return 'archive';
  if (type.includes('ftp') || type.includes('sftp')) return 'server';
  return 'cloud';
}

/* ==================== Theme & language ==================== */
function setTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('syncpulse_theme', theme);
  document.getElementById('opt-dark').classList.toggle('active', theme === 'dark');
  document.getElementById('opt-light').classList.toggle('active', theme === 'light');
}

function setLang(l) {
  if (!i18n[l]) return;
  lang = l;
  localStorage.setItem('syncpulse_language_v2', lang);
  applyStaticI18n();
  renderLangGrid();
  renderHome();
  renderTasks();
  renderClouds(lastCloudsData);
}

function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t()[key]) el.textContent = t()[key];
  });
}

function renderLangGrid() {
  const grid = document.getElementById('lang-grid');
  grid.innerHTML = Object.keys(LANG_LABELS).map(code => `
    <button class="lang-opt ${code === lang ? 'active' : ''}" onclick="setLang('${code}')">${LANG_LABELS[code]}</button>
  `).join('');
}

/* ==================== Tabs ==================== */
let lastCloudsData = [];
function switchTab(tab) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
  if (tab === 'clouds') loadClouds();
}

/* ==================== WebSocket ==================== */
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  socket = new WebSocket(proto + location.host + '/ws');

  socket.onopen = () => document.getElementById('conn-dot').classList.add('online');
  socket.onclose = () => {
    document.getElementById('conn-dot').classList.remove('online');
    setTimeout(connectWS, 3000);
  };
  socket.onerror = () => socket.close();

  socket.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    if (data.type === 'init') {
      tasks = data.tasks || [];
      STATE = data.state || STATE;
    } else if (data.type === 'update') {
      STATE = data.state || STATE;
    }
    renderHome();
    renderTasks();
    if (currentFilesTaskId && document.getElementById('mFiles').classList.contains('open')) {
      renderFiles();
      if (currentFilesTab === 'log') renderLog();
    }
  };
}

/* ==================== Home (running tasks) ==================== */
function renderHome() {
  const list = document.getElementById('home-list');
  const running = tasks.filter(tk => (STATE.running[String(tk.id)] || 'idle') !== 'idle');

  if (running.length === 0) {
    list.innerHTML = `<div class="empty-state"><i class="fas fa-wave-square"></i>
      <div>${t().home_empty_title}</div>
      <div style="font-weight:500; margin-top:4px; opacity:.8;">${t().home_empty_sub}</div>
    </div>`;
    return;
  }

  list.innerHTML = running.map(tk => {
    const tid = String(tk.id);
    const status = STATE.running[tid] || 'idle';
    const stats = STATE.stats[tid] || {};
    const percent = stats.percent || 0;
    const activeFile = (STATE.active_files[tid] && STATE.active_files[tid][0]) || null;
    const statusText = status === 'simulating' ? t().status_sim : t().status_active;

    return `
    <div class="card running" onclick="showFiles('${tk.id}')">
      <div class="card-header">
        <div class="card-title"><div class="status-dot active"></div><span>${tk.name}</span></div>
        <div class="badge">${statusText}</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-file">${activeFile ? activeFile.name : '...'}</div>
        <div class="prog-bg"><div class="prog-fill" style="width:${activeFile ? activeFile.progress : percent}%"></div></div>
      </div>
      <div class="card-footer">
        <button class="btn-action btn-stop" onclick="event.stopPropagation(); stopSync('${tk.id}')"><i class="fas fa-stop"></i> ${t().btn_stop}</button>
        <i class="fas fa-history icon-history" onclick="event.stopPropagation(); showHistory('${tk.id}')"></i>
      </div>
    </div>`;
  }).join('');
}

/* ==================== Tarefas (all tasks) ==================== */
function renderTasks() {
  const list = document.getElementById('tasks-list');
  if (tasks.length === 0) {
    list.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i>${t().tasks_empty}</div>`;
    return;
  }

  list.innerHTML = tasks.map(tk => {
    const tid = String(tk.id);
    const status = STATE.running[tid] || 'idle';
    const isRunning = status !== 'idle';
    const licenseActive = STATE.license_active === true;
    const hasErrors = STATE.failed_files[tid] && STATE.failed_files[tid].length > 0;

    const syncLabel = tk.type === 'bisync' ? t().mode_bi : (tk.type === 'upload' ? t().mode_up : t().mode_down);
    const triggerText = tk.trigger === 'real' ? t().opt_real : (tk.interval === 'daily' ? `${t().daily} ${tk.daily_time || '03:00'}` : (tk.interval || '—'));

    let statusText = t().status_inactive;
    const stats = STATE.stats[tid] || null;
    if (status === 'active') statusText = t().status_active;
    if (status === 'simulating') statusText = t().status_sim;
    if (status === 'idle' && stats && stats.percent === 100) statusText = t().status_done;

    return `
    <div class="card ${isRunning ? 'running' : ''}" onclick="showFiles('${tk.id}')">
      <div class="card-header">
        <div class="card-title"><div class="status-dot ${isRunning ? 'active' : ''}"></div><span>${tk.name}</span></div>
        <div style="display:flex; align-items:center; gap:8px;">
          ${hasErrors ? '<i class="fas fa-triangle-exclamation" style="color:#eab308;font-size:12px;"></i>' : ''}
          <div class="badge">${statusText}</div>
        </div>
      </div>
      <div class="path-line"><b>L:</b>${tk.local}</div>
      <div class="path-line"><b>C:</b>${tk.remote}</div>
      <div class="meta-row">
        <span><i class="fas fa-rotate"></i> ${syncLabel}</span>
        <span><i class="fas fa-clock"></i> ${triggerText}</span>
      </div>
      <div class="last-sync">${t().last_sync}: ${tk.last_sync || '—'}</div>
      <div class="card-footer">
        <button class="btn-action btn-sim" onclick="event.stopPropagation(); startSync('${tk.id}', true)"><i class="fas fa-flask"></i> ${t().btn_simulate}</button>
        <button class="btn-action ${isRunning ? 'btn-stop' : 'btn-play'} ${!licenseActive ? 'disabled' : ''}"
          onclick="event.stopPropagation(); ${licenseActive ? (isRunning ? `stopSync('${tk.id}')` : `startSync('${tk.id}', false)`) : ''}">
          <i class="fas ${isRunning ? 'fa-stop' : 'fa-play'}"></i> ${isRunning ? t().btn_stop : t().btn_start}
        </button>
        <i class="fas fa-history icon-history" onclick="event.stopPropagation(); showHistory('${tk.id}')"></i>
      </div>
    </div>`;
  }).join('');
}

async function startSync(id, simulate) {
  try {
    await fetch(`/api/sync/${id}?simulate=${simulate ? 'true' : 'false'}`, { method: 'POST' });
  } catch (e) { console.error(e); }
}
async function stopSync(id) {
  try {
    await fetch(`/api/sync/stop/${id}`, { method: 'POST' });
  } catch (e) { console.error(e); }
}
/* ==================== Modais ==================== */
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- Histórico ---------- */
async function showHistory(id) {
  const tk = tasks.find(x => String(x.id) === String(id));
  document.getElementById('history-title').textContent = tk ? `${t().hist_title} · ${tk.name}` : t().hist_title;
  const body = document.getElementById('history-body');
  body.innerHTML = `<div class="modal-empty"><i class="fas fa-circle-notch fa-spin"></i>${t().status_active}...</div>`;
  openModal('mHistory');

  try {
    const r = await fetch(`/api/history/${id.toString()}`);
    const data = await r.json();

    if (!data || !Array.isArray(data) || data.length === 0) {
      body.innerHTML = `<div class="modal-empty"><i class="fas fa-inbox"></i>${t().hist_empty}</div>`;
      return;
    }

    body.innerHTML = data.map((h, index) => {
      const isSim = h.type === 'Simulação';
      const typeLabel = isSim ? t().hist_sim : t().hist_sync;
      const modeLabel = h.mode === 'upload' ? t().mode_up : (h.mode === 'download' ? t().mode_down : t().mode_bi);
      const ok = h.status === 'Sucesso';
      const statusLabel = ok ? t().hist_success : t().hist_error;

      return `
      <div class="hist-entry">
        <div class="hist-top">
          <span class="hist-date">${escapeHtml(h.date || '')}</span>
          <span class="hist-type ${isSim ? 'sim' : 'sync'}">${typeLabel}</span>
        </div>
        <div class="hist-mid">
          <span class="hist-mode"><i class="fas fa-exchange-alt"></i>${modeLabel}</span>
          <span class="hist-status ${ok ? 'ok' : 'err'}"><i class="fas ${ok ? 'fa-check-circle' : 'fa-triangle-exclamation'}"></i>${statusLabel}</span>
        </div>
        ${!ok && h.log ? `
          <button class="hist-err-btn" onclick="toggleHistLog(${index})">${t().hist_view_err}</button>
          <div id="hist-log-${index}" class="hist-log hidden">${escapeHtml(h.log)}</div>
        ` : ''}
      </div>`;
    }).join('');
  } catch (error) {
    console.error('Erro ao carregar histórico:', error);
    body.innerHTML = `<div class="modal-empty"><i class="fas fa-triangle-exclamation"></i>${t().clouds_error}</div>`;
  }
}

function toggleHistLog(index) {
  document.getElementById(`hist-log-${index}`).classList.toggle('hidden');
}

/* ---------- Lista de ficheiros (fxs) ---------- */
function showFiles(id) {
  currentFilesTaskId = String(id);
  currentFilesTab = 'files';
  const tk = tasks.find(x => String(x.id) === currentFilesTaskId);
  document.getElementById('files-title').textContent = tk ? `${t().files_title} · ${tk.name}` : t().files_title;
  document.getElementById('tab-btn-files').classList.add('active');
  document.getElementById('tab-btn-log').classList.remove('active');
  document.getElementById('files-body').classList.remove('hidden');
  document.getElementById('log-body').classList.add('hidden');
  renderFiles();
  renderLog();
  openModal('mFiles');
}

function switchFilesTab(tabName) {
  currentFilesTab = tabName;
  document.getElementById('tab-btn-files').classList.toggle('active', tabName === 'files');
  document.getElementById('tab-btn-log').classList.toggle('active', tabName === 'log');
  document.getElementById('files-body').classList.toggle('hidden', tabName !== 'files');
  document.getElementById('log-body').classList.toggle('hidden', tabName !== 'log');
  if (tabName === 'log') renderLog();
}

function renderLog() {
  if (!currentFilesTaskId) return;
  const body = document.getElementById('log-body');
  const lines = STATE.logs?.[currentFilesTaskId] || [];

  if (lines.length === 0) {
    body.innerHTML = `<div class="log-placeholder">> ${t().log_empty}</div>`;
    return;
  }

  body.innerHTML = lines.slice(0, 50).map(l => `<div class="log-line">> ${escapeHtml(l)}</div>`).join('');
}

function renderFiles() {
  if (!currentFilesTaskId) return;
  const body = document.getElementById('files-body');
  const tid = currentFilesTaskId;

  const allFiles = [...new Set(STATE.all_files?.[tid] || [])];
  const finished = STATE.finished_files?.[tid] || [];
  const active = STATE.active_files?.[tid] || [];
  const failed = STATE.failed_files?.[tid] || [];
  const skipped = STATE.skipped_files?.[tid] || [];
  const sizes = STATE.file_sizes?.[tid] || {};

  if (allFiles.length === 0) {
    body.innerHTML = `<div class="modal-empty"><i class="fas fa-folder-open"></i>${t().hist_empty}</div>`;
    return;
  }

  const sortedFiles = [...allFiles].sort((a, b) => b.localeCompare(a, undefined, { numeric: true, sensitivity: 'base' }));

  body.innerHTML = sortedFiles.map(fullPath => {
    const lastSlash = fullPath.lastIndexOf('/');
    const displayName = lastSlash !== -1 ? fullPath.substring(lastSlash + 1) : fullPath;
    const folderPath = lastSlash !== -1 ? fullPath.substring(0, lastSlash + 1) : '';
    const weightValue = sizes[fullPath] || '';

    let color = 'var(--text-dim)', icon = 'fa-clock', label = t().file_pending, pct = 0;

    if (failed.includes(fullPath)) {
      color = 'var(--red)'; icon = 'fa-times-circle'; label = t().file_error; pct = 100;
    } else if (finished.includes(fullPath)) {
      color = 'var(--green)'; icon = 'fa-check-circle'; label = t().file_done; pct = 100;
    } else if (active.some(x => x.name === fullPath)) {
      const a = active.find(x => x.name === fullPath);
      pct = a.progress;
      color = 'var(--accent)'; icon = 'fa-sync fa-spin'; label = pct + '%';
    } else if (skipped.includes(fullPath)) {
      color = 'var(--orange)'; icon = 'fa-equals'; label = t().file_skipped; pct = 100;
    }

    return `
    <div class="file-row">
      <div class="file-icon" style="color:${color}"><i class="fas ${icon}"></i></div>
      <div class="file-info">
        <div class="file-name">${escapeHtml(displayName)}</div>
        ${folderPath ? `<div class="file-path">${escapeHtml(folderPath)}</div>` : ''}
        <div class="file-mini-bar"><div class="file-mini-fill" style="width:${pct}%; background:${color}"></div></div>
      </div>
      <div class="file-status" style="color:${color}">${label}${weightValue ? ' · ' + weightValue : ''}</div>
    </div>`;
  }).join('');
}

/* ==================== Clouds ==================== */
async function loadClouds() {
  const list = document.getElementById('clouds-list');
  list.innerHTML = `<div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i>${t().clouds_loading}</div>`;
  try {
    const res = await fetch('/api/remotes/list_with_quota');
    const remotes = await res.json();
    lastCloudsData = remotes;
    renderClouds(remotes);
  } catch (e) {
    list.innerHTML = `<div class="empty-state"><i class="fas fa-plug-circle-xmark"></i>${t().clouds_error}</div>`;
  }
}

function renderClouds(remotes) {
  const list = document.getElementById('clouds-list');
  if (!remotes) return;
  if (remotes.length === 0) {
    list.innerHTML = `<div class="empty-state"><i class="fas fa-cloud"></i>${t().clouds_empty}</div>`;
    return;
  }

  list.innerHTML = remotes.map(r => {
    const total = r.quota.total || 0;
    const used = r.quota.used || 0;
    const percent = total > 0 ? Math.round((used / total) * 100) : 0;
    const supported = r.quota.supported;

    return `
    <div class="cloud-card">
      <div class="cloud-head">
        <div class="cloud-icon"><i class="fab fa-${getIcon(r.type)}"></i></div>
        <div>
          <div class="cloud-name">${r.name}</div>
          <div class="cloud-type">${r.type}</div>
        </div>
      </div>
      <div class="quota-row">
        <span class="label">${t().clouds_used}</span>
        <span class="used">${supported ? formatSize(used) : '—'}</span>
      </div>
      <div class="prog-bg"><div class="prog-fill" style="width:${supported ? percent : 0}%"></div></div>
      <div class="quota-foot">
        <span>${supported ? percent + '%' : t().clouds_error === '' ? '' : '?'}</span>
        <span>${t().clouds_total}: ${supported ? formatSize(total) : '—'}</span>
      </div>
    </div>`;
  }).join('');
}

/* ==================== Init ==================== */
function init() {
  setTheme(theme);
  applyStaticI18n();
  renderLangGrid();
  renderHome();
  renderTasks();
  connectWS();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
