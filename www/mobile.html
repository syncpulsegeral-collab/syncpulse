<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SyncPulse Mobile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

  :root {
    --bg: #050a12; --bg-elevated: #0b111d; --card: #111d29;
    --border: #1e293b; --text: #ffffff; --accent: #3b82f6;
    --red: #ef4444; --green: #22c55e; --orange: #f97316;
  }

  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  .topbar { padding: 20px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .conn-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); }
  .conn-dot.online { background: var(--green); box-shadow: 0 0 10px var(--green); }

  /* Views */
  .view { display: none; flex: 1; overflow-y: auto; padding: 20px 20px 100px; }
  .view.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 15px; position: relative; }
  .card.running { border-left: 4px solid var(--accent); }
  .badge { font-size: 10px; background: rgba(59, 130, 246, 0.1); color: var(--accent); padding: 4px 12px; border-radius: 12px; font-weight: 800; }
  
  .path-text { font-family: monospace; font-size: 10px; color: #64748b; margin: 10px 0; overflow: hidden; text-overflow: ellipsis; }

  /* Progress Bar */
  .prog-bg { background: #070e1e; height: 8px; border-radius: 10px; margin-top: 10px; border: 1px solid var(--border); overflow: hidden; }
  .prog-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.5s; box-shadow: 0 0 10px var(--accent); }

  /* Bottom Nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: var(--bg-elevated); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, 1fr); z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #475569; font-size: 10px; font-weight: 700; text-transform: uppercase; gap: 4px; }
  .nav-item.active { color: var(--accent); }

  /* File List */
  .file-row { padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .back-btn { color: var(--accent); font-weight: 800; font-size: 12px; margin-bottom: 20px; display: block; }
</style>
</head>
<body>

  <div class="topbar">
    <div>
      <h1 class="text-white font-black uppercase tracking-tighter text-lg">Sync<span class="text-blue-500">Pulse</span></h1>
      <span class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Mobile Edition</span>
    </div>
    <div id="conn-dot" class="conn-dot"></div>
  </div>

  <!-- HOME (ATIVAS) -->
  <div class="view active" id="view-home">
    <h2 class="text-[11px] font-black text-slate-500 uppercase tracking-widest mb-4">Execução em tempo real</h2>
    <div id="home-list"></div>
  </div>

  <!-- CLOUDS -->
  <div class="view" id="view-clouds">
    <h2 class="text-[11px] font-black text-slate-500 uppercase tracking-widest mb-4">Armazenamento Cloud</h2>
    <div id="clouds-list"></div>
  </div>

  <!-- TAREFAS (TODAS) -->
  <div class="view" id="view-tasks">
    <h2 class="text-[11px] font-black text-slate-500 uppercase tracking-widest mb-4">Todas as Tarefas</h2>
    <div id="tasks-list"></div>
  </div>

  <!-- SUB-PÁGINA: LISTA DE FICHEIROS -->
  <div class="view" id="view-detail">
    <button class="back-btn" onclick="switchTab('tasks')"><i class="fas fa-arrow-left mr-2"></i> Voltar às Tarefas</button>
    <div id="detail-header" class="mb-6"></div>
    <div id="file-list" class="space-y-1"></div>
  </div>

  <!-- MENU -->
  <div class="view" id="view-menu">
    <h2 class="text-[11px] font-black text-slate-500 uppercase tracking-widest mb-6">Definições</h2>
    <div class="card">
        <p class="text-sm font-bold mb-2">Motor: ZimaOS 2.0</p>
        <p class="text-[10px] text-slate-500 uppercase">Hardware ID detetado</p>
    </div>
    <button onclick="location.reload()" class="w-full py-4 bg-slate-800 rounded-2xl text-xs font-black uppercase">Reiniciar Interface</button>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="home" onclick="switchTab('home')"><i class="fas fa-home text-lg"></i><span>Home</span></div>
    <div class="nav-item" data-tab="clouds" onclick="switchTab('clouds')"><i class="fas fa-cloud text-lg"></i><span>Clouds</span></div>
    <div class="nav-item" data-tab="tasks" onclick="switchTab('tasks')"><i class="fas fa-list-ul text-lg"></i><span>Tarefas</span></div>
    <div class="nav-item" data-tab="menu" onclick="switchTab('menu')"><i class="fas fa-bars text-lg"></i><span>Menu</span></div>
  </nav>

<script>
let socket, tasks = [], STATE = {}, currentTid = null;

function switchTab(tab) {
  currentTid = null;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  const navItem = document.querySelector(`[data-tab="${tab}"]`);
  if(navItem) navItem.classList.add('active');
  if(tab === 'clouds') loadClouds();
}

/* --- WebSocket --- */
function connect() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  socket = new WebSocket(proto + location.host + '/ws');
  
  socket.onopen = () => document.getElementById('conn-dot').classList.add('online');
  socket.onclose = () => {
    document.getElementById('conn-dot').classList.remove('online');
    setTimeout(connect, 3000);
  };
  
  socket.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    if(data.type === 'init') { tasks = data.tasks; STATE = data.state; }
    if(data.type === 'update') { STATE = data.state; }
    renderAll();
  };
}

function renderAll() {
  renderHome();
  renderTasks();
  if(currentTid) renderDetail();
}

function renderTasks() {
  const list = document.getElementById('tasks-list');
  list.innerHTML = tasks.map(tk => {
    const isRunning = (STATE.running[tk.id] || 'idle') !== 'idle';
    return `
    <div class="card ${isRunning ? 'running' : ''}" onclick="openDetail('${tk.id}')">
      <div class="flex justify-between items-center">
        <span class="font-bold text-sm">${tk.name}</span>
        <span class="badge">${STATE.running[tk.id] || 'Inativo'}</span>
      </div>
      <div class="path-text">L: ${tk.local}<br>C: ${tk.remote}</div>
      <div class="flex gap-4 mt-2">
        <button class="text-blue-500" onclick="event.stopPropagation(); startSync('${tk.id}')"><i class="fas fa-play"></i></button>
        <button class="text-red-500" onclick="event.stopPropagation(); stopSync('${tk.id}')"><i class="fas fa-stop"></i></button>
      </div>
    </div>`;
  }).join('');
}

function renderHome() {
  const list = document.getElementById('home-list');
  const running = tasks.filter(tk => (STATE.running[tk.id] || 'idle') !== 'idle');
  
  if(!running.length) {
    list.innerHTML = '<div class="p-10 text-center text-slate-600 text-xs italic border-2 border-dashed border-slate-800 rounded-3xl">Nenhuma tarefa ativa no momento</div>';
    return;
  }

  list.innerHTML = running.map(tk => {
    const stats = STATE.stats[tk.id] || { percent: 0 };
    const active = STATE.active_files[tk.id]?.[0] || { name: 'A aguardar...' };
    return `
    <div class="card running" onclick="openDetail('${tk.id}')">
      <div class="font-bold text-sm mb-2">${tk.name}</div>
      <div class="text-[10px] text-blue-400 truncate mb-1">${active.name}</div>
      <div class="prog-bg"><div class="prog-fill" style="width: ${stats.percent}%"></div></div>
      <div class="text-right text-[9px] font-bold mt-1 text-slate-500">${stats.percent}%</div>
    </div>`;
  }).join('');
}

function openDetail(id) {
    currentTid = id;
    switchTab('detail');
    renderDetail();
}

function renderDetail() {
    const tk = tasks.find(t => String(t.id) === String(currentTid));
    const container = document.getElementById('file-list');
    const header = document.getElementById('detail-header');
    if(!tk) return;

    header.innerHTML = `<h2 class="text-xl font-black">${tk.name}</h2><p class="text-[10px] text-blue-500 uppercase font-bold">${tk.type}</p>`;
    
    const all = STATE.all_files[currentTid] || [];
    if(!all.length) { container.innerHTML = '<p class="text-center py-10 opacity-30 text-xs">Sem ficheiros na fila</p>'; return; }

    container.innerHTML = all.map(f => {
        let color = "#475569", icon = "fa-clock", status = "Pendente";
        if(STATE.finished_files[currentTid]?.includes(f)) { color = "var(--green)"; icon = "fa-check-circle"; status = "Concluído"; }
        if(STATE.failed_files[currentTid]?.includes(f)) { color = "var(--red)"; icon = "fa-times-circle"; status = "Erro"; }
        if(STATE.active_files[currentTid]?.some(a => a.name === f)) { color = "var(--accent)"; icon = "fa-sync fa-spin"; status = "A copiar..."; }
        
        return `
        <div class="file-row">
            <div class="flex items-center gap-3 truncate">
                <i class="fas ${icon}" style="color: ${color}"></i>
                <span class="text-xs truncate font-medium">${f.split('/').pop()}</span>
            </div>
            <span class="text-[8px] font-black uppercase" style="color: ${color}">${status}</span>
        </div>`;
    }).join('');
}

async function loadClouds() {
  const list = document.getElementById('clouds-list');
  const r = await fetch('/api/remotes/list_with_quota');
  const data = await r.json();
  list.innerHTML = data.map(c => `
    <div class="card">
        <div class="flex justify-between items-center mb-4">
            <span class="font-bold">${c.name}</span>
            <span class="text-[9px] badge">${c.type}</span>
        </div>
        <div class="prog-bg"><div class="prog-fill" style="width: ${c.quota.total ? (c.quota.used/c.quota.total)*100 : 0}%"></div></div>
    </div>`).join('');
}

async function startSync(id) { await fetch(`/api/sync/${id}?simulate=false`, {method:'POST'}); }
async function stopSync(id) { await fetch(`/api/sync/stop/${id}`, {method:'POST'}); }

window.onload = connect;
</script>
</body>
</html>
