<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SyncPulse - Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
	<link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050a12; color: #cbd5e1; font-family: 'Inter', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }
        .gradient-text { background: linear-gradient(90deg, #00D1FF, #9D50BB); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .tier-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #1e293b; }
        .dash-card { background: #0b1120; border: 1px solid #1e293b; border-radius: 20px; }
        
        /* Cores e estilos das sub-páginas */
        :root { --accent: #3b82f6; --orange: #f97316; --green: #22c55e; --red: #ef4444; --border: #1e293b; }
        .view { display: none; flex: 1; overflow-y: auto; padding: 16px 16px 100px; }
        .view.active { display: block; }
        .card { background: #111d29; border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
        .card.running { border-left: 3px solid var(--accent); background: #162635; }
        .file-item { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
        .prog-bg { background: rgba(255,255,255,0.05); height: 6px; border-radius: 4px; overflow: hidden; }
        .prog-fill { background: var(--accent); height: 100%; transition: width 0.4s; }
        .back-btn { color: var(--accent); font-size: 12px; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 6px; background: none; border: none; }
        
        /* Navbar Fixa */
        .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #0b111d; border-top: 1px solid var(--border); padding: 8px 6px 25px; z-index: 50; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #475569; background: none; border: none; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

    <!-- TOPBAR -->
	<nav class="fixed w-full z-[100] glass py-4 px-6 border-b border-white/5">
		<div class="flex justify-between items-center">
			<div class="flex items-center gap-3">
				<div id="conn-dot" class="w-2 h-2 rounded-full bg-red-500"></div>
				<span class="font-black tracking-tighter text-sm uppercase text-white">Sync<span class="text-cyan-400">Pulse</span></span>
			</div>
			<select onchange="setLang(this.value)" id="lPick" class="bg-transparent text-[10px] text-slate-500 font-bold border-none outline-none">
				<option value="pt">PT</option><option value="en">EN</option>
			</select>
		</div>
	</nav>

    <main class="pt-20 h-screen flex flex-col">
        <!-- VIEW HOME -->
        <div class="view active" id="view-home">
            <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4" data-i18n="home_title">Execução</div>
            <div id="home-list"></div>
        </div>

        <!-- VIEW CLOUDS -->
        <div class="view" id="view-clouds">
            <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4" data-i18n="clouds_title">Clouds</div>
            <div id="clouds-list"></div>
        </div>

        <!-- VIEW TAREFAS -->
        <div class="view" id="view-tasks">
            <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4" data-i18n="tasks_title">Tarefas</div>
            <div id="tasks-list"></div>
        </div>

        <!-- SUB-VIEW: LISTA DE FICHEIROS -->
        <div class="view" id="view-task-detail">
            <button class="back-btn" onclick="switchTab('tasks')"><i class="fas fa-arrow-left"></i> VOLTAR</button>
            <div id="detail-header" class="mb-4"></div>
            <div id="file-list"></div>
        </div>

        <!-- SUB-VIEW: HISTÓRICO -->
        <div class="view" id="view-history">
            <button class="back-btn" onclick="switchTab('tasks')"><i class="fas fa-arrow-left"></i> VOLTAR</button>
            <div id="history-header" class="mb-4"></div>
            <div id="history-list-content"></div>
        </div>

        <!-- VIEW DEFINIÇÕES -->
        <div class="view" id="view-settings">
            <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4">Definições</div>
            <div class="dash-card p-6 mb-4">
                <div class="text-xs font-bold mb-4">Aparência</div>
                <div class="flex bg-slate-900 p-1 rounded-xl">
                    <button class="flex-1 py-2 text-[10px] font-bold uppercase rounded-lg bg-blue-600">Escuro</button>
                    <button class="flex-1 py-2 text-[10px] font-bold uppercase rounded-lg">Claro</button>
                </div>
            </div>
            <button onclick="location.reload()" class="w-full py-4 bg-slate-800 rounded-2xl text-[10px] font-black uppercase">Reiniciar Interface</button>
        </div>
    </main>

    <!-- BARRA INFERIOR -->
    <div class="bottom-nav">
        <button class="nav-item active" data-tab="home" onclick="switchTab('home')"><i class="fas fa-house"></i><span>Home</span></button>
        <button class="nav-item" data-tab="clouds" onclick="switchTab('clouds')"><i class="fas fa-cloud"></i><span>Clouds</span></button>
        <button class="nav-item" data-tab="tasks" onclick="switchTab('tasks')"><i class="fas fa-list-check"></i><span>Tarefas</span></button>
        <button class="nav-item" data-tab="settings" onclick="switchTab('settings')"><i class="fas fa-gear"></i><span>Definições</span></button>
    </div>

<script>
const i18n = {
    pt: { home_title: "Em Execução", clouds_title: "Minhas Clouds", tasks_title: "Todas as Tarefas", btn_stop: "Parar", btn_start: "Iniciar", btn_sim: "Simular", status_done: "Concluído", status_active: "Ativo", status_sim: "Simulando" },
    en: { home_title: "Running", clouds_title: "My Clouds", tasks_title: "All Tasks", btn_stop: "Stop", btn_start: "Start", btn_sim: "Simulate", status_done: "Done", status_active: "Active", status_sim: "Simulating" }
};

let lang = localStorage.getItem('syncpulse_language_v2') || 'pt';
let tasks = [], STATE = { running:{}, stats:{}, active_files:{}, finished_files:{}, all_files:{}, failed_files:{}, skipped_files:{}, file_sizes:{} }, socket;
let currentTid = null;

function t() { return i18n[lang] || i18n.pt; }

/* --- Navegação --- */
function switchTab(tab) {
    currentTid = null;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const target = document.getElementById('view-' + tab);
    if(target) target.classList.add('active');
    const nav = document.querySelector(`[data-tab="${tab}"]`);
    if(nav) nav.classList.add('active');
    if(tab === 'clouds') loadClouds();
}

/* --- Renderização dos Cartões --- */
function renderCard(tk) {
    const tid = String(tk.id);
    const status = STATE.running[tid] || 'idle';
    const isRunning = status !== 'idle';
    const stats = STATE.stats[tid] || { percent: 0 };
    const activeFile = (STATE.active_files[tid] && STATE.active_files[tid][0]) || null;

    return `
    <div class="card ${isRunning ? 'running' : ''}" onclick="openTaskDetail('${tk.id}')">
        <div class="flex justify-between items-center mb-3">
            <span class="font-bold text-sm text-white">${tk.name}</span>
            <span class="text-[9px] font-bold uppercase py-1 px-3 bg-black/30 rounded-lg text-slate-500">
                ${isRunning ? (status === 'simulating' ? t().status_sim : t().status_active) : 'Inativo'}
            </span>
        </div>
        ${isRunning ? `
            <div class="mb-3">
                <div class="text-[10px] text-blue-400 truncate mb-1">${activeFile ? activeFile.name : '...'}</div>
                <div class="prog-bg"><div class="prog-fill" style="width:${activeFile ? activeFile.progress : stats.percent}%"></div></div>
            </div>
        ` : `
            <div class="text-[9px] text-slate-500 mb-1 truncate">L: ${tk.local}</div>
            <div class="text-[9px] text-slate-500 mb-4 truncate">C: ${tk.remote}</div>
        `}
        <div class="flex justify-between items-center border-t border-white/5 pt-3">
            <div class="flex gap-4">
                ${isRunning ? 
                    `<button class="text-red-500 text-xs font-black uppercase" onclick="event.stopPropagation(); stopSync('${tk.id}')">${t().btn_stop}</button>` :
                    `<button class="text-blue-500 text-xs font-black uppercase" onclick="event.stopPropagation(); startSync('${tk.id}', false)">${t().btn_start}</button>
                     <button class="text-orange-500 text-xs font-black uppercase" onclick="event.stopPropagation(); startSync('${tk.id}', true)">${t().btn_sim}</button>`
                }
            </div>
            <i class="fas fa-clock-rotate-left text-slate-600" onclick="event.stopPropagation(); showHistory('${tk.id}')"></i>
        </div>
    </div>`;
}

function renderAll() {
    const homeList = document.getElementById('home-list');
    const tasksList = document.getElementById('tasks-list');
    const running = tasks.filter(tk => (STATE.running[tk.id] || 'idle') !== 'idle');

    homeList.innerHTML = running.length ? running.map(tk => renderCard(tk)).join('') : '<p class="text-center py-10 opacity-30 text-xs">Nada em execução</p>';
    tasksList.innerHTML = tasks.map(tk => renderCard(tk)).join('');
    
    if(currentTid && document.getElementById('view-task-detail').classList.contains('active')) renderTaskDetail();
}

/* --- Sub-página: Ficheiros --- */
function openTaskDetail(id) {
    currentTid = String(id);
    switchTab('task-detail');
    renderTaskDetail();
}

function renderTaskDetail() {
    const container = document.getElementById('file-list');
    const tk = tasks.find(x => String(x.id) === currentTid);
    if (!tk) return;

    document.getElementById('detail-header').innerHTML = `<h2 class="text-lg font-black text-white">${tk.name}</h2><p class="text-[9px] text-blue-500 uppercase font-bold">${tk.type}</p>`;

    const all = STATE.all_files[currentTid] || [];
    container.innerHTML = all.length ? all.map(f => {
        let color = "#475569", icon = "fa-clock", lbl = "Pendente", p = 0;
        if(STATE.finished_files[currentTid]?.includes(f)) { color="#22c55e"; icon="fa-circle-check"; lbl="OK"; p=100; }
        else if(STATE.failed_files[currentTid]?.includes(f)) { color="#ef4444"; icon="fa-circle-xmark"; lbl="Erro"; p=100; }
        else if(STATE.skipped_files[currentTid]?.includes(f)) { color="#f97316"; icon="fa-equals"; lbl="Ignorado"; p=100; }
        const active = STATE.active_files[currentTid]?.find(a => a.name === f);
        if(active) { color="#3b82f6"; icon="fa-sync fa-spin"; lbl=active.progress+"%"; p=active.progress; }

        return `
        <div class="file-item">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs truncate font-bold mr-4" style="color:${color}"><i class="fas ${icon} mr-2"></i>${f.split('/').pop()}</span>
                <span class="text-[8px] font-black uppercase" style="color:${color}">${lbl}</span>
            </div>
            <div class="prog-bg"><div class="prog-fill" style="width:${p}%; background:${color}"></div></div>
        </div>`;
    }).join('') : '<p class="text-center py-10 opacity-30 text-xs">Sem ficheiros detetados</p>';
}

/* --- Sub-página: Histórico --- */
async function showHistory(id) {
    currentTid = String(id);
    switchTab('history');
    const tk = tasks.find(x => String(x.id) === id);
    document.getElementById('history-header').innerHTML = `<h2 class="text-lg font-black text-white">${tk ? tk.name : ''}</h2>`;
    const list = document.getElementById('history-list-content');
    list.innerHTML = '<p class="text-center py-10 opacity-30 text-xs">A carregar histórico...</p>';

    const r = await fetch(`/api/history/${id}`);
    const data = await r.json();
    list.innerHTML = data.length ? data.map(h => `
        <div class="card">
            <div class="flex justify-between text-[10px] font-black mb-2">
                <span class="${h.type === 'Simulação' ? 'text-orange-500' : 'text-blue-500'}">${h.type.toUpperCase()}</span>
                <span class="text-slate-500">${h.date}</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-300">${h.mode}</span>
                <span class="text-[10px] font-black uppercase ${h.status === 'Sucesso' ? 'text-green-500' : 'text-red-500'}">${h.status}</span>
            </div>
        </div>`).join('') : '<p class="text-center py-10 opacity-30 text-xs">Sem histórico</p>';
}

/* --- API & WebSocket --- */
function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    socket = new WebSocket(proto + location.host + '/ws');
    socket.onopen = () => document.getElementById('conn-dot').className = 'w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]';
    socket.onclose = () => { document.getElementById('conn-dot').className = 'w-2 h-2 rounded-full bg-red-500'; setTimeout(connectWS, 3000); };
    socket.onmessage = (ev) => {
        const d = JSON.parse(ev.data);
        if(d.type === 'init') { tasks = d.tasks; STATE = d.state; }
        if(d.type === 'update') { STATE = d.state; }
        renderAll();
    };
}

async function loadClouds() {
    const list = document.getElementById('clouds-list');
    const r = await fetch('/api/remotes/list_with_quota');
    const rems = await r.json();
    list.innerHTML = rems.map(c => {
        const p = c.quota.total ? Math.round((c.quota.used/c.quota.total)*100) : 0;
        return `
        <div class="dash-card p-5 mb-3">
            <div class="flex justify-between items-center mb-3">
                <span class="font-bold text-white text-sm">${c.name}</span>
                <span class="text-[10px] text-blue-400 font-black">${p}%</span>
            </div>
            <div class="prog-bg"><div class="prog-fill" style="width:${p}%"></div></div>
            <div class="flex justify-between mt-2 text-[9px] text-slate-500 font-bold uppercase">
                <span>${(c.quota.used/1e9).toFixed(1)} GB</span><span>Total: ${(c.quota.total/1e9).toFixed(1)} GB</span>
            </div>
        </div>`;
    }).join('');
}

async function startSync(id, sim) { await fetch(`/api/sync/${id}?simulate=${sim}`, {method:'POST'}); }
async function stopSync(id) { await fetch(`/api/sync/stop/${id}`, {method:'POST'}); }
function setLang(l) { lang=l; localStorage.setItem('syncpulse_language_v2', l); location.reload(); }

document.addEventListener('DOMContentLoaded', connectWS);
</script>
</body>
</html>
