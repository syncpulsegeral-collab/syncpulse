name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # PASSO CRÍTICO: Converte o nome do owner para minúsculas
      - name: Lowercase Repo Owner
        run: |
          echo "OWNER_LC=${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Usamos a variável OWNER_LC que criámos no passo anterior
          # Nota: tags docker também devem ser minúsculas (v1.2 em vez de V1.2)
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/syncpulse:latest
            ghcr.io/${{ env.OWNER_LC }}/syncpulse:v1.2
          # Ativa cache para builds mais rápidas no futuro
          cache-from: type=gha
          cache-to: type=inline