name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # PASSO CORRIGIDO: Usa manipulação de string nativa do Bash
      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Agora garantimos que a variável OWNER_LC está preenchida e em minúsculas
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/syncpulse:latest            
            ghcr.io/${{ env.OWNER_LC }}/syncpulse:v2.2
          cache-from: type=gha
          cache-to: type=inline